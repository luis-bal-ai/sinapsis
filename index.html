<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sinapsis">
<meta name="theme-color" content="#FBE1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#130F15" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* En pantalla completa del iPhone, la barra de estado queda sobre el fondo de la app */
/* iOS a pantalla completa: sin esto la barra de abajo se queda flotando con un hueco debajo */
html{min-height:calc(100% + env(safe-area-inset-top,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}</style>
</head>
<body>
<title>Sinapsis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: app de móvil a una columna (máx. 560px), cabecera con saludo, tarjetas por bloque, barra de pestañas flotante abajo.
   Estilo: rosa chicle + lila sobre fondo rubor, toques lima, serif en cursiva para el nombre y las frases. */
:root{
  --bg:#FBE1EC; --surface:#FFF9FC; --surface-2:#FCEBF3; --ink:#221724; --ink-2:#5C4D5F; --ink-3:#9A8293; --line:#F2D2E0;
  --accent:#EE3F7E; --accent-ink:#FFFFFF; --accent-soft:#FDE2EC;
  --lilac:#8B7CF6; --lilac-soft:#ECE8FF; --pop:#D4F25A; --pop-ink:#1D2405;
  --ok:#17A57E; --ok-soft:#D8F3EA; --flame:#F2782B; --flame-soft:#FFE8D8; --late:#D7263D;
  --hero:#2B1631; --hero-ink:#FFF4FA;
  --blob1:rgba(238,63,126,.24); --blob2:rgba(139,124,246,.22);
  --shadow:0 1px 2px rgba(120,30,80,.06),0 10px 30px rgba(190,50,120,.10);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#130F15; --surface:#1E1822; --surface-2:#29212E; --ink:#F7EEF5; --ink-2:#CBBCCA; --ink-3:#8F7F8E; --line:#352B39;
  --accent:#FF5C95; --accent-ink:#1E0A12; --accent-soft:#45202F;
  --lilac:#A89CFF; --lilac-soft:#2A2545; --pop:#D4F25A; --pop-ink:#1D2405;
  --ok:#47D5A8; --ok-soft:#163229; --flame:#FF9A52; --flame-soft:#3A2716; --late:#FF6B7E;
  --hero:#2E1736; --hero-ink:#FFF4FA;
  --blob1:rgba(255,92,149,.14); --blob2:rgba(168,156,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#130F15; --surface:#1E1822; --surface-2:#29212E; --ink:#F7EEF5; --ink-2:#CBBCCA; --ink-3:#8F7F8E; --line:#352B39;
  --accent:#FF5C95; --accent-ink:#1E0A12; --accent-soft:#45202F;
  --lilac:#A89CFF; --lilac-soft:#2A2545; --pop:#D4F25A; --pop-ink:#1D2405;
  --ok:#47D5A8; --ok-soft:#163229; --flame:#FF9A52; --flame-soft:#3A2716; --late:#FF6B7E;
  --hero:#2E1736; --hero-ink:#FFF4FA;
  --blob1:rgba(255,92,149,.14); --blob2:rgba(168,156,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(520px 380px at 105% -5%,var(--blob1),transparent 70%),radial-gradient(480px 420px at -15% 30%,var(--blob2),transparent 70%);background-attachment:fixed;background-repeat:no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:20px calc(112px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}

/* Cabecera */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.025em;margin:4px 0 0;text-wrap:balance}
h1 em{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:1.18em;letter-spacing:-.01em;color:var(--accent)}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.lvl-chip{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:0}
.lvl-chip b{font-size:11px;font-weight:700;color:var(--lilac);background:var(--lilac-soft);padding:3px 9px;border-radius:99px;white-space:nowrap}
.bar{height:6px;width:110px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lilac),var(--accent));border-radius:99px;transition:width .4s}
.sync{font-size:11px;color:var(--ink-3);background:none;border:0;padding:0;cursor:pointer;text-align:right}
.sync.on{color:var(--accent)}

/* Tarjetas */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0;font-size:14px;color:var(--ink);flex:1 1 220px}

/* Cuenta atrás examen */
.exam-hero{position:relative;overflow:hidden;background:radial-gradient(260px 200px at 100% 0%,rgba(238,63,126,.55),transparent 70%),radial-gradient(240px 200px at 0% 120%,rgba(139,124,246,.45),transparent 70%),var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:end;cursor:pointer;border:0;text-align:left;width:100%}
.exam-hero .eyebrow{color:color-mix(in srgb,var(--hero-ink) 65%,transparent)}
.exam-hero h3{margin:2px 0 0;font-family:var(--f-display);font-size:20px;line-height:1.15;font-weight:700}
.exam-hero .num{color:var(--pop);font-family:var(--f-display);font-weight:800;font-size:60px;line-height:.9;letter-spacing:-.03em;text-align:right;font-variant-numeric:tabular-nums}
.exam-hero .unit{font-size:12px;text-align:right;color:color-mix(in srgb,var(--hero-ink) 70%,transparent)}
.exam-hero .meta{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:13px;color:color-mix(in srgb,var(--hero-ink) 75%,transparent)}
.exam-hero .meta .bar{background:color-mix(in srgb,var(--hero-ink) 20%,transparent);flex:1;width:auto}
.exam-hero .meta .bar i{background:var(--pop)}

/* Listas de pendientes */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.list .item:first-child{border-top:0}
.item .stripe{align-self:stretch;border-radius:4px}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .when{font-size:12px;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.when.late{color:var(--late)} .when.soon{color:var(--accent)} .when.ok{color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.tag.exam{background:var(--accent-soft);color:var(--accent)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.empty{padding:14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink-3);font-size:14px;text-align:center}

/* Hábitos */
.habit{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .habit:first-child{border-top:0}
.check{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;transition:transform .15s,background .2s,border-color .2s}
.check svg{width:22px;height:22px;opacity:0;transition:opacity .2s}
.check.on{background:var(--hc,var(--ok));border-color:var(--hc,var(--ok))}
.check.on svg{opacity:1;color:#fff}
.check:active{transform:scale(.92)}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:var(--flame);background:var(--flame-soft);padding:3px 8px;border-radius:99px;font-variant-numeric:tabular-nums}
.streak svg{width:13px;height:13px}
.streak.zero{color:var(--ink-3);background:var(--surface-2)}
.week{display:flex;gap:4px;margin-top:5px}
.week i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.week i.on{background:var(--hc,var(--ok))}
.week i.today{outline:1.5px solid var(--ink-3);outline-offset:1px}

/* Uni */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--ink-2)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -6px var(--accent)}
.btn.ghost{background:transparent;color:var(--ink-2);padding:8px 6px}
.btn.danger{background:transparent;color:var(--late)}
.btn.danger.armed{background:var(--late);color:var(--surface)}
.btn svg{width:16px;height:16px}
details summary{cursor:pointer;color:var(--ink-2);font-weight:600;font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}

/* Progreso */
.net-wrap{position:relative;border-radius:var(--r);overflow:hidden;background:radial-gradient(300px 220px at 90% 10%,rgba(238,63,126,.35),transparent 70%),var(--hero);aspect-ratio:4/3;max-width:100%}
.net-wrap canvas{width:100%;height:100%;display:block}
.net-cap{position:absolute;left:14px;bottom:12px;right:14px;color:var(--hero-ink);display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
.net-cap b{font-family:var(--f-display);font-size:30px;line-height:1;font-weight:800}
.net-cap span{font-size:12px;opacity:.75}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stage{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-3);min-width:0}
.stage i{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.stage i b{display:block;height:100%;background:var(--accent)}
.stage.cur{color:var(--ink);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border-radius:14px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;min-width:0}
.badge .n{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.2}
.badge .d{font-size:12px;color:var(--ink-3)}
.badge.on{background:linear-gradient(135deg,var(--accent-soft),var(--lilac-soft))}
.badge.on .n{color:var(--accent)}
.badge .who{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.compound svg{width:100%;height:auto;display:block}
.bignum{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Calendario */
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-nav .btns{display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding-bottom:2px}
.day{min-height:64px;border:0;border-radius:10px;background:var(--surface-2);padding:5px 4px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;min-width:0;overflow:hidden}
.day .dn{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);line-height:1;padding:3px 4px;align-self:flex-start;border-radius:6px}
.day.out{background:transparent}
.day.out .dn{color:var(--ink-3);opacity:.55}
.day.today .dn{background:var(--accent);color:var(--accent-ink)}
.day.sel{outline:2px solid var(--ink);outline-offset:-2px}
.day .lbl{display:block;font-size:10px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:1px 4px;color:#fff}
.day .lbl.exam{font-weight:800}
.day .more{font-size:10px;color:var(--ink-3);font-weight:700;padding-left:2px}
.day .ex{display:flex;gap:2px;margin-top:auto;padding-left:2px}
.day .ex i{width:6px;height:6px;border-radius:50%}
@media (max-width:480px){.day .lbl{font-size:0;height:5px;padding:0}.day .lbl.exam{height:8px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:6px;border-radius:3px;display:inline-block;background:var(--ink-3)}
.legend i.big{height:9px}
.legend i.dot{width:7px;height:7px;border-radius:50%}
.evrow{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.list .evrow:first-child{border-top:0}
.evrow .stripe{align-self:stretch;border-radius:4px}

/* Ejercicio */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.qbtn{border:0;border-radius:14px;padding:12px;background:var(--surface-2);display:flex;align-items:center;gap:10px;text-align:left;font-weight:700;min-width:0}
.qbtn .ic{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:16px}
.qbtn .tx{display:flex;flex-direction:column;min-width:0}
.qbtn .tx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbtn small{font-weight:500;color:var(--ink-3);font-size:12px}
.qbtn.add{background:transparent;border:1.5px dashed var(--line);color:var(--ink-2);justify-content:center}
.qbtn.editing{outline:2px dashed var(--ink-3);outline-offset:-2px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 7px;border-radius:12px;background:var(--surface-2);min-width:0;border:0}
.wkd .l{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase}
.wkd .n{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.wkd .stack{display:flex;flex-direction:column-reverse;gap:3px;align-items:center;min-height:52px;justify-content:flex-start}
.wkd .stack i{width:20px;height:11px;border-radius:4px}
.wkd .min{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-height:12px}
.wkd.today{outline:2px solid var(--accent);outline-offset:-2px}
.wkd.future{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}
.bytype{display:flex;flex-direction:column;gap:8px}
.bt{display:grid;grid-template-columns:minmax(0,7.5em) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bt .trk{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bt .trk i{display:block;height:100%;border-radius:4px}
.bt .v{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.heat .c{aspect-ratio:1;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;max-width:100%;border:0;padding:0}
.heat .c.blank{background:transparent}
.heat .c.l1{background:color-mix(in srgb,var(--ok) 28%,var(--surface-2));color:var(--ink)}
.heat .c.l2{background:color-mix(in srgb,var(--ok) 58%,var(--surface-2));color:var(--ink)}
.heat .c.l3{background:var(--ok);color:var(--surface)}
.heat .c.today{outline:2px solid var(--accent);outline-offset:-2px}
.minis{display:flex;gap:8px;flex-wrap:wrap}

/* Frase del día */
.quote{position:relative;padding:16px 18px 14px;border-radius:var(--r);background:linear-gradient(135deg,var(--lilac-soft),var(--accent-soft));display:flex;flex-direction:column;gap:8px}
.quote p{margin:0;font-family:var(--f-serif);font-style:italic;font-size:21px;line-height:1.25;color:var(--ink);text-wrap:pretty}
.quote span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.quote .lab{position:absolute;top:-9px;left:16px;background:var(--pop);color:var(--pop-ink);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px}

/* Tarjetas de repaso */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--surface-2)}
.seg button{border:0;background:none;border-radius:12px;padding:9px;font-weight:700;font-size:14px;color:var(--ink-3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.due{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px;border-radius:var(--r);background:radial-gradient(220px 160px at 100% 0%,rgba(238,63,126,.5),transparent 70%),var(--hero);color:var(--hero-ink)}
.due b{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--pop);font-variant-numeric:tabular-nums}
.due span{font-size:13px;opacity:.8}
.due .btn{background:var(--pop);color:var(--pop-ink)}
.fc-row{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.list .fc-row:first-child{border-top:0}
.fc-row .stripe{align-self:stretch;border-radius:4px}
.fc-row .f{font-weight:600;overflow-wrap:anywhere}

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const hoy = () => iso(new Date());
const diasHasta = s => Math.round((Date.UTC(...s.split("-").map((v,i)=>i===1?v-1:+v)) - Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/864e5);
const fmtFecha = s => new Intl.DateTimeFormat("es-ES",{weekday:"short",day:"numeric",month:"short"}).format(parse(s));
const fmtLargo = d => new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long"}).format(d);
function cuando(s){
  const n = diasHasta(s);
  if (n < 0) return {txt: n===-1 ? "Ayer" : `Hace ${-n} d`, cls:"late"};
  if (n === 0) return {txt:"Hoy", cls:"soon"};
  if (n === 1) return {txt:"Mañana", cls:"soon"};
  if (n <= 7) return {txt:`En ${n} días`, cls:"soon"};
  return {txt: fmtFecha(s), cls:"ok"};
}
const lunes = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay()+6)%7)); };
const DOW = ["L","M","X","J","V","S","D"];
const fmtMes = d => { const t = new Intl.DateTimeFormat("es-ES",{month:"long", year:"numeric"}).format(d); return t.charAt(0).toUpperCase()+t.slice(1); };
const fmtDiaLargo = s => { const t = new Intl.DateTimeFormat("es-ES",{weekday:"long", day:"numeric", month:"long"}).format(parse(s)); return t.charAt(0).toUpperCase()+t.slice(1); };
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function subir(){

// Trae lo de la cuenta y decide qué versión vale (la más reciente).
async function bajar(){
  if (!sb || !cuenta) return;
  const { data, error } = await sb.from("sinapsis").select("datos, updated_at").eq("user_id", cuenta.id).maybeSingle();
  if (error) { modo = "pendiente"; pintarSync(); return; }
  const primera = primeraBajada; primeraBajada = false;
  let vinculada = null; try { vinculada = localStorage.getItem(LS_VINC); } catch {}
  if (!data) { // cuenta recién creada: se sube lo que haya en este dispositivo
    try { localStorage.setItem(LS_VINC, cuenta.id); } catch {}
    state.updatedAt = Date.now(); guardarLocal(); return subir();
  }
  // Primera vez en este dispositivo con esta cuenta y aquí ya había cosas: que elija ella.
  if (primera && vinculada !== cuenta.id && tieneDatos(state) && state.updatedAt > 0) {
    ui.conflicto = data; preguntarConflicto(); return;
  }
  try { localStorage.setItem(LS_VINC, cuenta.id); } catch {}
  aplicarRemoto(data);
}
function aplicarRemoto(d){
  if (!d || !d.datos || ui.conflicto) return;
  const r = Number(d.updated_at) || 0;
  if (r === ultimaEscritura && r === state.updatedAt) { modo = "db"; pintarSync(); return; }
  if (r > (state.updatedAt || 0)) {
    try { state = completar(d.datos); state.updatedAt = r; guardarLocal(); if (!document.querySelector(".scrim")) render(); } catch {}
    modo = "db"; pintarSync();

}

// Racha con "día comodín": un día sin marcar por semana no la rompe.
function racha(hid){
  const set = new Set(state.marcas[hid]||[]);
  let d = new Date(), i = 0, n = 0, perdon = -99;
  if (!set.has(iso(d))) { d = addDays(d,-1); i = 1; }
  for (let guard=0; guard<1000; guard++){
    if (set.has(iso(d))) n++;
    else if (n>0 && i-perdon>=7 && set.has(iso(addDays(d,-1)))) perdon = i;
    else break;
    d = addDays(d,-1); i++;
  }
  return n;
}

function confeti(fuerte){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let cv = document.getElementById("confeti");
  if (!cv){ cv = document.createElement("canvas"); cv.id = "confeti"; document.body.appendChild(cv); }
  const dpr = window.devicePixelRatio||1, W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const cols = ["#EE3F7E","#8B7CF6","#D4F25A","#3BA4E8","#F59E42","#FFFFFF"];
  const n = fuerte ? 160 : 90, ps = [];
  for (let i=0;i<n;i++){ const lado = i%2 ? 1 : -1;
    ps.push({x: lado>0 ? -10 : W+10, y: H*0.62, vx: -lado*(4+Math.random()*7)*-1, vy: -(9+Math.random()*9), r: 4+Math.random()*5,
      c: cols[i%cols.length], a: Math.random()*6, va: (Math.random()-.5)*.3, f: Math.random()<.5}); }
  ps.forEach(p=>{ p.vx = (p.x<0?1:-1)*(3+Math.random()*7); });
  const t0 = performance.now();
  (function paso(t){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      if (p.f) ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); else { ctx.beginPath(); ctx.arc(0,0,p.r/2.4,0,7); ctx.fill(); } ctx.restore(); });
    if (t - t0 < 2600) requestAnimationFrame(paso); else ctx.clearRect(0,0,W,H);
  })(t0);
}

    ${curvaSVG(n)}</section>`;

function curvaSVG(n){
  const W=320,H=120,L=8,R=8,T=10,B=22, max=Math.log(Math.pow(1.01,365));
  const x = d => L + d/365*(W-L-R), y = d => T + (1 - Math.log(Math.pow(1.01,d))/max)*(H-T-B);
  let p=""; for(let d=0; d<=365; d+=5) p += (d?"L":"M")+x(d).toFixed(1)+","+y(d).toFixed(1);
  const cn = Math.min(n,365);
  let pa=""; for(let d=0; d<=cn; d+=1) pa += (d?"L":"M")+x(d).toFixed(1)+","+y(d).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de mejora del 1% diario durante un año">
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)" stroke-width="1"/>
    <path d="${p}" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 4"/>
    ${cn>0?`<path d="${pa}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>`:""}
    <circle cx="${x(cn)}" cy="${y(cn)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--ink-3)">Día 0</text>
    <text x="${W-R}" y="${H-6}" font-size="10" fill="var(--ink-3)" text-anchor="end">Día 365</text></svg>`;
}

  const se = ui.sesion; if (!se) return;

    </button>

function calificar(v){
  const se = ui.sesion, t = state.tarjetas.find(x=>x.id===se.ids[se.i]);
  if (v===0){ t.caja = 0; t.due = hoy(); se.ids.push(t.id); }
  else { if (!t.fallo) se.ok++; t.caja = Math.min((t.caja||0) + v, INTERVALOS.length-1); t.due = iso(addDays(new Date(), INTERVALOS[t.caja])); }
  if (v===0) t.fallo = true; else delete t.fallo;
  anotar("card", t.id+"@"+Date.now());
  se.i++; se.flip = false;
  state.updatedAt = Date.now(); guardarLocal(); programarGuardado();
  pintarEstudio();
}

/* ---------- Temporizador de estudio (Pomodoro) ---------- */
const mmss = ms => { const t = Math.max(0, Math.ceil(ms/1000)); return `${pad(Math.floor(t/60))}:${pad(t%60)}`; };
function restante(){ const a = state.estudio.activo; if (!a) return 0; return a.pausa!=null ? a.pausa : a.fin - Date.now(); }
function vistaEstudio(){
  const a = state.estudio.activo, E = state.estudio;
  if (!ui.pomoAsig || !state.asignaturas.some(x=>x.id===ui.pomoAsig)) ui.pomoAsig = (ui.asig!=="todas" && ui.asig) || state.asignaturas[0]?.id || null;
  const pre = PRESETS.find(p=>p.id===ui.pomoPreset) || PRESETS[0];
  const total = a ? a.dur*60000 : pre.foco*60000, rem = a ? restante() : total;
  const C = 2*Math.PI*108, frac = a ? 1 - rem/total : 0;
  const color = a && a.fase==="descanso" ? "var(--ok)" : "var(--accent)";
  const etiqueta = !a ? "Listo" : a.fase==="descanso" ? "Descanso" : a.pausa!=null ? "En pausa" : "Concentración";
  let h = `<section class="card pomo">${a && a.fase==="foco" ? `<img class="stk-float stk-pomo" src="${stickerDia(2)}" alt="">` : ""}
    <div class="ring"><svg viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="108" fill="none" stroke="var(--line)" stroke-width="12"/>
      <circle id="pomo-ring" cx="120" cy="120" r="108" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-frac)).toFixed(1)}"/></svg>
      <div class="tm"><span id="pomo-lab">${etiqueta}</span><b id="pomo-time">${mmss(rem)}</b><small>${a ? esc(asig(a.asig).nombre) : ""}</small></div></div>`;
  if (!a){
    h += `<div class="field" style="width:100%"><label for="f-pomo-asig">¿Qué vas a estudiar?</label><select id="f-pomo-asig" data-a="nada">${optsAsig(ui.pomoAsig)}</select></div>
      <div class="presets">${PRESETS.map(p=>`<button class="chip ${p.id===pre.id?"on":""}" data-a="preset" data-id="${p.id}">${p.n} · ${p.foco}+${p.desc} min</button>`).join("")}</div>
      <div class="actions"><button class="btn primary big" data-a="pomoStart" ${state.asignaturas.length?"":"disabled"}>Empezar ${pre.foco} min</button></div>`;
  } else {
    h += `<div class="actions">${a.fase==="foco" ? `<button class="btn primary big" data-a="pomoPausa">${a.pausa!=null?"Seguir":"Pausar"}</button>` : ""}
      <button class="btn big" data-a="pomoStop">${a.fase==="foco"?"Terminar":"Saltar descanso"}</button></div>
      <p class="muted small" style="margin:0;text-align:center">${a.fase==="foco"?`Después vienen ${a.desc} min de descanso. Puedes cerrar la app: el tiempo sigue contando.`:"Levántate, bebe agua, mira lejos de la pantalla."}</p>`;
  }
  h += `</section>`;
  // Estadísticas
  const hoyS = hoy(), ini = iso(lunes(new Date()));
  const sesHoy = E.sesiones.filter(x=>x.fecha===hoyS), sesSem = E.sesiones.filter(x=>x.fecha>=ini);
  const sum = arr => arr.reduce((t,x)=>t+x.min,0);
  const fmtH = m => m>=60 ? `${Math.floor(m/60)} h ${m%60?pad(m%60):""}`.trim() : `${m} min`;
  const porAsig = state.asignaturas.map(x=>({a:x, m:sum(sesSem.filter(s=>s.asig===x.id))})).filter(x=>x.m>0).sort((p,q)=>q.m-p.m);
  const max = Math.max(1,...porAsig.map(x=>x.m));
  h += `<section class="card"><h2>Tu tiempo de estudio</h2>
    <div class="stats"><div class="stat"><b>${fmtH(sum(sesHoy))}</b><span>hoy</span></div><div class="stat"><b>${fmtH(sum(sesSem))}</b><span>esta semana</span></div><div class="stat"><b>${E.sesiones.length}</b><span>sesiones</span></div></div>
    ${porAsig.length ? `<div class="bytype">${porAsig.map(x=>`<div class="bt"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.a.nombre)}</span><span class="trk"><i style="width:${x.m/max*100}%;background:${x.a.color}"></i></span><span class="v">${fmtH(x.m)}</span></div>`).join("")}</div>`
      : `<div class="empty">Cuando termines tu primera sesión, aquí verás cuánto le dedicas a cada asignatura esta semana.</div>`}</section>`;
  return h;
}
function pomoStart(){
  const sel = document.getElementById("f-pomo-asig"); if (sel) ui.pomoAsig = sel.value;
  const pre = PRESETS.find(p=>p.id===ui.pomoPreset) || PRESETS[0];
  state.estudio.activo = {asig:ui.pomoAsig, fase:"foco", dur:pre.foco, desc:pre.desc, inicio:Date.now(), fin:Date.now()+pre.foco*60000, pausa:null};
  desbloquearAudio(); commit();
}
function registrarSesion(min, cuando){
  const a = state.estudio.activo; if (!a || min < 1) return;
  const ses = {id:uid(), asig:a.asig, min:Math.round(min), fecha:iso(new Date(cuando||Date.now()))};
  state.estudio.sesiones.push(ses); anotar("foco", ses.id, ses.fecha);
}
function finFase(){
  const a = state.estudio.activo; if (!a) return;
  const ahora = Date.now();
  if (a.fase==="foco"){
    registrarSesion(a.dur, a.fin);
    const finDesc = a.fin + a.desc*60000;
    state.estudio.activo = ahora < finDesc ? {...a, fase:"descanso", dur:a.desc, fin:finDesc, pausa:null} : null;
    pitido(); confeti(); toast(`${a.dur} minutos de estudio`, ahora < finDesc ? `Ahora ${a.desc} min de descanso. ${MENSAJES_LUIS[Math.floor(Math.random()*MENSAJES_LUIS.length)]}` : "Sesión guardada.");
  } else { state.estudio.activo = null; pitido(); toast("Descanso terminado", "¿Otra ronda?"); }
  commit();
}
let audioCtx = null;
function desbloquearAudio(){ try { audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); } catch {} }
function pitido(){ try { if (!audioCtx || document.hidden) return; [0,0.25,0.5].forEach(t=>{ const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.0001, audioCtx.currentTime+t);
  g.gain.exponentialRampToValueAtTime(.25, audioCtx.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime+t+.2);
  o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+.22); }); } catch {} }
setInterval(() => {
  const a = state.estudio && state.estudio.activo; if (!a || a.pausa!=null) return;
  const rem = a.fin - Date.now();
  if (rem <= 0) return finFase();
  const t = document.getElementById("pomo-time"); if (t) t.textContent = mmss(rem);
  const r = document.getElementById("pomo-ring");
  if (r){ const C = 2*Math.PI*108; r.setAttribute("stroke-dashoffset", (C*(rem/(a.dur*60000))).toFixed(1)); }
  const m = document.getElementById("pomo-mini-t"); if (m) m.textContent = mmss(rem);
}, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.estudio?.activo && state.estudio.activo.pausa==null && state.estudio.activo.fin <= Date.now()) finFase(); });


/* ---------- Ánimo: gráfica y relaciones ---------- */
function vistaAnimo(){
  const dias = Array.from({length:30},(_,i)=>iso(addDays(new Date(), i-29)));
  const reg = Object.entries(state.animo);
  let h = `<section class="card"><div class="sec-head"><h2>Tu ánimo</h2><span class="muted small">últimos 30 días</span></div>`;
  if (reg.length < 2) return h + `<div class="empty">Marca cómo estás cada día en la pestaña Hoy. Con unos días de datos verás aquí tu evolución y qué cosas te sientan mejor.</div></section>`;
  // Gráfica
  const W=320,H=130,L=40,R=8,T=10,B=22, x = i => L + i*(W-L-R)/29, y = v => T + (5-v)*(H-T-B)/4;
  let path = "", prev = false;
  dias.forEach((d,i)=>{ const a = state.animo[d]; if (a){ path += (prev?"L":"M")+x(i).toFixed(1)+","+y(a.v).toFixed(1); prev = true; } else prev = false; });
  const media = reg.reduce((t,[,a])=>t+a.v,0)/reg.length;
  h += `<div class="mood-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ánimo de los últimos 30 días, media ${media.toFixed(1)} sobre 5">
    ${[1,3,5].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3.5}" font-size="10" fill="var(--ink-3)" text-anchor="end">${ANIMOS[v-1].n}</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--lilac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dias.map((d,i)=>{ const a = state.animo[d]; return a?`<circle cx="${x(i).toFixed(1)}" cy="${y(a.v).toFixed(1)}" r="${d===hoy()?5:3.6}" fill="${ANIMOS[a.v-1].c}" stroke="var(--surface)" stroke-width="1.5"/>`:""; }).join("")}
    <text x="${L}" y="${H-5}" font-size="10" fill="var(--ink-3)">${fmtFecha(dias[0])}</text><text x="${W-R}" y="${H-5}" font-size="10" fill="var(--ink-3)" text-anchor="end">Hoy</text></svg></div>
    <p class="muted small" style="margin:0">Media: <b style="color:var(--ink)">${media.toFixed(1).replace(".",",")}</b> sobre 5 · ${reg.length} ${reg.length===1?"día registrado":"días registrados"}</p>`;
  // Relaciones: compara la media los días con y sin cada cosa
  const factores = [];
  const minEstudio = d => state.estudio.sesiones.filter(s=>s.fecha===d).reduce((t,s)=>t+s.min,0);
  factores.push({n:"haces ejercicio", f:d=>state.ejercicio.registros.some(r=>r.fecha===d)});
  factores.push({n:"estudias 1 hora o más", f:d=>minEstudio(d)>=60});
  factores.push({n:"repasas tarjetas", f:d=>state.log.some(e=>e.k==="card" && e.d===d)});
  state.habitos.forEach(hb=>factores.push({n:`cumples “${hb.nombre}”`, f:d=>(state.marcas[hb.id]||[]).includes(d)}));
  state.ejercicio.tipos.forEach(t=>factores.push({n:`haces ${t.nombre.toLowerCase()}`, f:d=>state.ejercicio.registros.some(r=>r.fecha===d && r.tipo===t.id)}));
  const res = factores.map(fc=>{ const si = reg.filter(([d])=>fc.f(d)).map(([,a])=>a.v), no = reg.filter(([d])=>!fc.f(d)).map(([,a])=>a.v);
    if (si.length<2 || no.length<2) return null; const m = a=>a.reduce((t,v)=>t+v,0)/a.length;
    return {n:fc.n, si:m(si), no:m(no), dif:m(si)-m(no), k:si.length}; }).filter(r=>r && Math.abs(r.dif)>=0.3).sort((a,b)=>Math.abs(b.dif)-Math.abs(a.dif)).slice(0,4);
  const f1 = v => v.toFixed(1).replace(".",",");
  if (res.length){
    h += `<h2 style="font-size:16px">Lo que te sienta bien (y lo que no)</h2><div style="display:flex;flex-direction:column;gap:8px">${res.map(r=>`<div class="insight"><b class="${r.dif>0?"up":"down"}">${r.dif>0?"+":""}${f1(r.dif)}</b><span>Los días que ${esc(r.n)}, tu ánimo es de ${f1(r.si)} frente a ${f1(r.no)} cuando no.</span></div>`).join("")}</div>
      <p class="muted small" style="margin:0">Ya lo sabes de clase: correlación no implica causalidad. Pero da pistas.</p>`;
  } else h += `<p class="muted small" style="margin:0">Cuando tengas más días registrados, aquí verás qué cosas se relacionan con que estés mejor: ejercicio, estudio, tus hábitos…</p>`;
  return h + `</section>`;
}

let calmaVista = null, calmaLimpieza = [];
function abrirCalma(vista){
  calmaLimpieza.forEach(f=>{ try{f();}catch{} }); calmaLimpieza = [];
  calmaVista = vista;
  let el = document.getElementById("calma");
  if (!vista){ if (el) el.remove(); document.body.style.overflow = ""; return; }
  if (!el){ el = document.createElement("div"); el.id = "calma"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); document.body.appendChild(el); }
  document.body.style.overflow = "hidden";
  const atras = vista==="menu" ? "cerrar" : "menu";
  const titulo = vista==="menu" ? "Calma" : CALMA_JUEGOS.find(j=>j.id===vista).n;
  el.innerHTML = `<div class="wrap"><div class="c-top"><button class="iconbtn" data-calma="${atras}" aria-label="Volver">${ICON.prev}</button><h1>${esc(titulo)}</h1></div><div id="c-body"></div></div>`;
  el.querySelector("[data-calma]").onclick = () => abrirCalma(atras==="cerrar" ? null : "menu");
  el.scrollTop = 0;
  ({menu:calmaMenu, burbujas:juegoBurbujas, cristal:juegoCristal, respira:juegoRespira, sonidos:juegoSonidos})[vista](document.getElementById("c-body"));
}

// Generadores de sonido sencillos con Web Audio
function ruidoBuffer(seg){ const ctx = audioCtx, n = ctx.sampleRate*seg, buf = ctx.createBuffer(1,n,ctx.sampleRate), d = buf.getChannelData(0); for (let i=0;i<n;i++) d[i] = Math.random()*2-1; return buf; }
function popSonido(){ try { const c = audioCtx; if (!c) return; const t = c.currentTime, src = c.createBufferSource(); src.buffer = ruidoBuffer(.08);
  const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1400+Math.random()*900; f.Q.value = 1.4;
  const g = c.createGain(); g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.07);
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(t); src.stop(t+.08); } catch {} }

function juegoBurbujas(b){
  let total = 0;
  b.innerHTML = `<div class="sec-head"><span class="muted">Toca o arrastra el dedo</span><span class="muted small" id="b-count">0 explotadas</span></div><div class="bubs" id="bubs"></div>`;
  const grid = b.querySelector("#bubs");
  const llenar = () => { grid.innerHTML = Array.from({length:54},()=>`<button class="bub" aria-label="Burbuja"></button>`).join(""); };
  llenar();
  const pop = el => { if (!el || !el.classList.contains("bub") || el.classList.contains("pop")) return;
    el.classList.add("pop"); total++; popSonido(); b.querySelector("#b-count").textContent = `${total} explotadas`;
    if (!grid.querySelector(".bub:not(.pop)")) setTimeout(()=>{ confeti(); llenar(); }, 350); };
  let pulsando = false;
  grid.addEventListener("pointerdown", e=>{ pulsando = true; desbloquearAudio(); pop(e.target); });
  grid.addEventListener("pointermove", e=>{ if (pulsando) pop(document.elementFromPoint(e.clientX, e.clientY)); });
  const fin = () => pulsando = false; window.addEventListener("pointerup", fin); calmaLimpieza.push(()=>window.removeEventListener("pointerup", fin));
}

const PAISAJES = [
  (c,W,H)=>{ const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#2B1655"); g.addColorStop(.55,"#E85D9E"); g.addColorStop(1,"#FFB36B"); c.fillStyle=g; c.fillRect(0,0,W,H);
    c.fillStyle="#FFE3A3"; c.beginPath(); c.arc(W*.62,H*.6,W*.12,0,7); c.fill();
    [["#7A2E6E",.68],["#4E1F57",.78],["#2A1236",.88]].forEach(([col,y],k)=>{ c.fillStyle=col; c.beginPath(); c.moveTo(0,H); for(let x=0;x<=W;x+=W/40) c.lineTo(x, H*y + Math.sin(x/W*6+k*2)*H*.05 + Math.sin(x/W*15+k)*H*.015); c.lineTo(W,H); c.fill(); }); },
  (c,W,H)=>{ const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0B1030"); g.addColorStop(1,"#2E3C7A"); c.fillStyle=g; c.fillRect(0,0,W,H);
    let s=11; const r=()=> (s=(s*16807)%2147483647)/2147483647; c.fillStyle="#fff"; for(let i=0;i<140;i++){ c.globalAlpha=.3+r()*.7; c.fillRect(r()*W, r()*H*.7, 1.6, 1.6); } c.globalAlpha=1;
    c.fillStyle="#FFF4D6"; c.beginPath(); c.arc(W*.75,H*.22,W*.08,0,7); c.fill(); c.fillStyle="#0B1030"; c.beginPath(); c.arc(W*.78,H*.2,W*.075,0,7); c.fill();
    c.fillStyle="#141A3D"; c.beginPath(); c.moveTo(0,H); for(let x=0;x<=W;x+=W/40) c.lineTo(x, H*.8+Math.sin(x/W*5)*H*.04); c.lineTo(W,H); c.fill(); },
  (c,W,H)=>{ const g = c.createLinearGradient(0,0,0,H*.55); g.addColorStop(0,"#9ED8F5"); g.addColorStop(1,"#FFE9D6"); c.fillStyle=g; c.fillRect(0,0,W,H);
    c.fillStyle="#FFF6E0"; c.beginPath(); c.arc(W*.3,H*.42,W*.09,0,7); c.fill();
    const m = c.createLinearGradient(0,H*.5,0,H); m.addColorStop(0,"#5FB7D9"); m.addColorStop(1,"#1F6E99"); c.fillStyle=m; c.fillRect(0,H*.5,W,H*.5);
    c.strokeStyle="rgba(255,255,255,.45)"; c.lineWidth=2; for(let y=H*.55;y<H;y+=H*.05){ c.beginPath(); for(let x=0;x<=W;x+=8) c.lineTo(x, y+Math.sin(x/30+y)*3); c.stroke(); } },
  (c,W,H)=>{ const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#C9F0E1"); g.addColorStop(1,"#5AA88A"); c.fillStyle=g; c.fillRect(0,0,W,H);
    let s=5; const r=()=> (s=(s*16807)%2147483647)/2147483647;
    [["#3F8A6F",.55,.18],["#2A6B54",.7,.22],["#1B4A3A",.85,.26]].forEach(([col,base,h])=>{ c.fillStyle=col; for(let i=0;i<14;i++){ const x=r()*W, hh=H*h*(0.7+r()*.6), w=hh*.35; c.beginPath(); c.moveTo(x,H*base-hh); c.lineTo(x-w,H*base+H*.06); c.lineTo(x+w,H*base+H*.06); c.fill(); } c.fillRect(0,H*base+H*.05,W,H); }); }
];
function juegoCristal(b){
  b.innerHTML = `<p class="muted" style="margin:0" id="g-msg">Pasa el dedo para limpiar el vaho.</p><div class="glass" id="glass"><canvas id="g-scene"></canvas><canvas id="g-fog"></canvas></div>`;
  const box = b.querySelector("#glass"), sc = b.querySelector("#g-scene"), fg = b.querySelector("#g-fog");
  const dpr = window.devicePixelRatio||1, W = box.clientWidth, H = box.clientHeight;
  [sc,fg].forEach(cv=>{ cv.width = W*dpr; cv.height = H*dpr; cv.getContext("2d").scale(dpr,dpr); });
  const cs = sc.getContext("2d"), cf = fg.getContext("2d");
  let k = Math.floor(Math.random()*PAISAJES.length), listo = false;
  const empañar = () => {
    PAISAJES[k%PAISAJES.length](cs,W,H); k++;
    cf.globalCompositeOperation = "source-over"; cf.clearRect(0,0,W,H);
    cf.fillStyle = "rgba(226,229,238,.94)"; cf.fillRect(0,0,W,H);
    for (let i=0;i<900;i++){ const x=Math.random()*W, y=Math.random()*H, r=.6+Math.random()*2.2;
      cf.fillStyle = `rgba(255,255,255,${.25+Math.random()*.4})`; cf.beginPath(); cf.arc(x,y,r,0,7); cf.fill(); }
    listo = false; b.querySelector("#g-msg").textContent = "Pasa el dedo para limpiar el vaho.";
  };
  empañar();
  // sonido de frotar
  let roce = null;
  try { const c = audioCtx; if (c){ const src = c.createBufferSource(); src.buffer = ruidoBuffer(2); src.loop = true;
    const f = c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=2200; f.Q.value=.7; const g = c.createGain(); g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(); roce = g; calmaLimpieza.push(()=>{ try{src.stop();}catch{} }); } } catch {}
  let ult = null;

    const g = cf.createRadialGradient(x,y,0,x,y,42); g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(.6,"rgba(0,0,0,.85)"); g.addColorStop(1,"rgba(0,0,0,0)");

  const tono = (fr) => { try { const c = audioCtx; if (!c) return; const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type="sine"; o.frequency.value = fr; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.08,t+.15); g.gain.exponentialRampToValueAtTime(.0001,t+1.2);

    const [nom, dur, tipo] = r.f[i], p = (enCiclo-acc)/dur, ease = .5 - Math.cos(Math.PI*p)/2;

}

// Sonidos para dormir: se generan como un archivo de audio en bucle (así siguen sonando con la pantalla apagada)
const SONIDOS = [{id:"lluvia",n:"Lluvia"},{id:"olas",n:"Olas del mar"},{id:"fuego",n:"Chimenea"},{id:"grillos",n:"Noche de verano"},{id:"rosa",n:"Ruido rosa"}];
const sonido = {vol:{lluvia:.7}, on:{lluvia:true}, audio:null, sonando:false, fin:null, timer:null, minutos:30};
function generarMezcla(){
  const sr = 22050, seg = 24, n = sr*seg, out = new Float32Array(n);
  const rosa = () => { const a = new Float32Array(n); let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i=0;i<n;i++){ const w = Math.random()*2-1; b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898;
      a[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926; } return a; };
  const marron = () => { const a = new Float32Array(n); let l = 0; for (let i=0;i<n;i++){ l = (l + .02*(Math.random()*2-1))/1.02; a[i] = l*3.5; } return a; };
  const gen = {
    lluvia: () => { const p = rosa(), a = new Float32Array(n); let prev = 0, hp = 0;
      for (let i=0;i<n;i++){ hp = .85*(hp + p[i]-prev); prev = p[i]; a[i] = hp*.9 + p[i]*.25; }
      for (let k=0;k<seg*25;k++){ const s0 = Math.floor(Math.random()*n), amp = .05+Math.random()*.2, len = 200; for (let j=0;j<len && s0+j<n;j++) a[s0+j] += (Math.random()*2-1)*amp*Math.exp(-j/30); }
      return a; },
    olas: () => { const m = marron(), p = rosa(), a = new Float32Array(n);
      for (let i=0;i<n;i++){ const t = i/sr, env = Math.pow(.5+.5*Math.sin(2*Math.PI*t/8 - Math.PI/2), 2.2); a[i] = (m[i]*.7 + p[i]*.5)*(.15+env); } return a; },
    fuego: () => { const m = marron(), a = new Float32Array(n); let lp = 0;
      for (let i=0;i<n;i++){ lp += .08*(m[i]-lp); a[i] = lp*1.6; }
      for (let k=0;k<seg*9;k++){ const s0 = Math.floor(Math.random()*n), amp = .15+Math.random()*.6, len = 60+Math.random()*200; for (let j=0;j<len && s0+j<n;j++) a[s0+j] += (Math.random()*2-1)*amp*Math.exp(-j/12); }
      return a; },
    grillos: () => { const a = new Float32Array(n), m = marron();
      for (let i=0;i<n;i++) a[i] = m[i]*.12;
      [[4400,.62,0],[4700,.85,.3],[4150,1.1,.55]].forEach(([fr,per,off])=>{ for (let t=off;t<seg;t+=per){ for (let p=0;p<3;p++){ const s0 = Math.floor((t+p*.045)*sr), len = Math.floor(.03*sr);
        for (let j=0;j<len && s0+j<n;j++){ const e = Math.sin(Math.PI*j/len); a[s0+j] += Math.sin(2*Math.PI*fr*j/sr)*.07*e; } } } });
      return a; },
    rosa: () => rosa()
  };
  let alguno = false;
  SONIDOS.forEach(x=>{ if (!sonido.on[x.id]) return; alguno = true; const a = gen[x.id](), v = sonido.vol[x.id] ?? .7; for (let i=0;i<n;i++) out[i] += a[i]*v; });
  if (!alguno) return null;

  const fx = Math.floor(sr*.6); for (let j=0;j<fx;j++){ const k = j/fx; out[j] = out[j]*k + out[n-fx+j]*(1-k); }
  const fin = out.subarray(0, n-fx); let pico = 0; for (let i=0;i<fin.length;i++) pico = Math.max(pico, Math.abs(fin[i]));

  dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); str(36,"data"); dv.setUint32(40,fin.length*2,true);

}
function reproducir(){

/* ---------- Red neuronal (canvas) ---------- */
let netAnim;
function dibujarRed(){
  cancelAnimationFrame(netAnim);
  const cv = document.getElementById("net"); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const W = r.width, H = r.height, css = getComputedStyle(document.documentElement);
  const colK = {animo:"#5DBB63", foco:css.getPropertyValue("--accent").trim(), card:css.getPropertyValue("--lilac").trim(), ejer:"#3BA4E8", hab:css.getPropertyValue("--flame").trim(), sub:css.getPropertyValue("--ok").trim(), tema:css.getPropertyValue("--ok").trim(), trab:css.getPropertyValue("--accent").trim(), exam:css.getPropertyValue("--accent").trim()};
  const bgInk = css.getPropertyValue("--hero-ink").trim();
  let seed = 7; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;
  const ev = state.log.slice(-180);
  const nodes = ev.map((e,i)=>{ let x,y; do { x=rnd()*2-1; y=rnd()*2-1; } while (x*x+y*y>1);
    return {x: W/2 + x*W*0.42, y: (H-40)/2 + y*(H-40)*0.42 + 6, c: colK[e.k]||bgInk, big: e.k==="trab"||e.k==="exam"}; });
  const edges = [];
  nodes.forEach((n,i)=>{ const near = nodes.slice(0,i).map((m,j)=>({j,d:(m.x-n.x)**2+(m.y-n.y)**2})).sort((a,b)=>a.d-b.d).slice(0,2); near.forEach(o=>edges.push([i,o.j])); });
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let pulses = [];
  function frame(t){
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth = 1; ctx.strokeStyle = bgInk; ctx.globalAlpha = .16;
    edges.forEach(([a,b])=>{ ctx.beginPath(); ctx.moveTo(nodes[a].x,nodes[a].y); ctx.lineTo(nodes[b].x,nodes[b].y); ctx.stroke(); });
    ctx.globalAlpha = 1;
    if (!reduce && edges.length){
      if (pulses.length < 6 && Math.random()<.05) pulses.push({e:edges[Math.floor(Math.random()*edges.length)], p:0});
      pulses = pulses.filter(p=>p.p<1);
      pulses.forEach(p=>{ p.p += .012; const a=nodes[p.e[0]], b=nodes[p.e[1]];
        ctx.beginPath(); ctx.fillStyle = a.c; ctx.globalAlpha = 1-p.p; ctx.arc(a.x+(b.x-a.x)*p.p, a.y+(b.y-a.y)*p.p, 2.2, 0, 7); ctx.fill(); });
      ctx.globalAlpha = 1;
    }
    nodes.forEach((n,i)=>{ const s = n.big?4.5:2.8; const pulse = reduce?0:Math.sin(t/700+i)*.5;
      ctx.beginPath(); ctx.fillStyle = n.c; ctx.arc(n.x,n.y,s+pulse,0,7); ctx.fill(); });
    if (!nodes.length){ ctx.fillStyle = bgInk; ctx.globalAlpha=.6; ctx.font = "14px Figtree, sans-serif"; ctx.textAlign="center"; ctx.fillText("Cada cosa que hagas creará una conexión", W/2, H/2-10); ctx.globalAlpha=1; }
    if (!reduce) netAnim = requestAnimationFrame(frame);
  }
  netAnim = requestAnimationFrame(frame);
}

/* ---------- Eventos ---------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id, tipo = el.dataset.tipo;
  if (a==="cerrarFondo"){ if (ev.target===el && !ui.conflicto){ if (ui.sesion){ ui.sesion=null; state.tarjetas.forEach(t=>delete t.fallo); commit(); } cerrar(); } return; }
  if (a!=="borrar") ui.armado = null;
  switch(a){
    case "cuenta": formCuenta(); break;
    case "salir": salir(); break;
    case "olvide": olvide(); break;
    case "usarCuenta": resolverConflicto(true); break;
    case "usarDispositivo": resolverConflicto(false); break;
    case "tab": ui.tab = el.dataset.tab; try{localStorage.setItem("sinapsis-tab",ui.tab);}catch{} render(); scrollTo(0,0); break;
    case "filtro": ui.asig = id; render(); break;
    case "ver": tipo==="trab" ? verTrabajo(id) : verExamen(id); break;
    case "marcar": {
      const m = state.marcas[id] = state.marcas[id]||[], d = hoy(), r = id+"@"+d;
      if (m.includes(d)) { m.splice(m.indexOf(d),1); desanotar("hab", r); } else { m.push(d); anotar("hab", r);
        if (state.habitos.length>1 && state.habitos.every(hb=>(state.marcas[hb.id]||[]).includes(d))){ confeti(); toast("Todos los hábitos de hoy hechos", "1% mejor que ayer."); } }
      commit(); break; }
    case "sub": {
      const o = (tipo==="trab"?state.trabajos:state.examenes).find(x=>x.id===id);
      const s = (tipo==="trab"?o.subtareas:o.temas).find(x=>x.id===el.dataset.s);
      s.ok = !s.ok; const k = tipo==="trab"?"sub":"tema"; s.ok ? anotar(k,s.id) : desanotar(k,s.id);
      commit(); tipo==="trab"?verTrabajo(id):verExamen(id); break; }
    case "hecho": {
      const o = (tipo==="trab"?state.trabajos:state.examenes).find(x=>x.id===id);
      o.hecho = !o.hecho; o.hecho ? anotar(tipo,o.id) : desanotar(tipo,o.id);
      if (o.hecho){ confeti(); toast(tipo==="trab"?"Trabajo entregado":"Examen hecho", MENSAJES_LUIS[Math.floor(Math.random()*MENSAJES_LUIS.length)]); }
      commit();
      tipo==="trab"?verTrabajo(id):verExamen(id); break; }
    case "color": document.getElementById("f-color").value = el.dataset.c;
      el.parentElement.querySelectorAll(".sw").forEach(s=>{ s.classList.toggle("on", s===el); s.setAttribute("aria-checked", s===el); }); break;
    case "mes": ui.mes = new Date(ui.mes.getFullYear(), ui.mes.getMonth()+(+el.dataset.d), 1); render(); break;
    case "mesHoy": ui.mes = new Date(new Date().getFullYear(), new Date().getMonth(), 1); ui.dia = hoy(); render(); break;
    case "dia": { ui.dia = el.dataset.d; const d = parse(ui.dia); if (d.getMonth()!==ui.mes.getMonth()) ui.mes = new Date(d.getFullYear(), d.getMonth(), 1); render(); break; }
    case "irDia": { ui.dia = el.dataset.d; const d = parse(ui.dia); ui.mes = new Date(d.getFullYear(), d.getMonth(), 1); ui.tab = "cal"; try{localStorage.setItem("sinapsis-tab",ui.tab);}catch{} render(); scrollTo(0,0); break; }
    case "sem": ui.semana = addDays(ui.semana, +el.dataset.d); render(); break;
    case "nuevoEvento": formEvento(null, el.dataset.d); break;
    case "editEvento": formEvento(id); break;
    case "registrar": formRegistro(id); break;
    case "editReg": formRegistro(null, id); break;
    case "editTipos": ui.editTipos = !ui.editTipos; render(); break;
    case "nuevoTipo": formTipo(); break;
    case "editTipo": formTipo(id); break;
    case "exportar": {
      const blob = new Blob([JSON.stringify(state)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `sinapsis-copia-${hoy()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      toast("Copia descargada", "Guárdala en Archivos o iCloud Drive."); break; }
    case "uniVista": ui.uniVista = el.dataset.v; render(); break;
    case "calma": desbloquearAudio(); abrirCalma("menu"); break;
    case "animo": { const d = hoy(), nuevo = !state.animo[d]; state.animo[d] = {v:+el.dataset.v}; if (nuevo) anotar("animo", "animo@"+d);
      commit(); if (nuevo) toast("Apuntado", +el.dataset.v<=2 ? "Los días malos también cuentan. Mañana será otro día." : "Gracias por contármelo."); break; }
    case "preset": { const sel = document.getElementById("f-pomo-asig"); if (sel) ui.pomoAsig = sel.value; ui.pomoPreset = id; render(); break; }
    case "pomoStart": pomoStart(); break;
    case "pomoPausa": { const a = state.estudio.activo; if (a.pausa!=null){ a.fin = Date.now()+a.pausa; a.pausa = null; } else { a.pausa = a.fin-Date.now(); } commit(); break; }
    case "pomoStop": { const a = state.estudio.activo;
      if (a.fase==="foco"){ const hecho = (a.dur*60000 - restante())/60000; registrarSesion(hecho); if (hecho>=1) toast(`${Math.round(hecho)} min guardados`); }
      state.estudio.activo = null; commit(); break; }
    case "irEstudio": ui.tab = "uni"; ui.uniVista = "estudio"; try{localStorage.setItem("sinapsis-tab",ui.tab);}catch{} render(); scrollTo(0,0); break;
    case "nuevaTarjeta": formTarjeta(); break;
    case "editTarjeta": formTarjeta(id); break;
    case "estudiar": empezarEstudio(!!el.dataset.todo); break;
    case "girar": ui.sesion.flip = true; pintarEstudio(); break;
    case "nota": calificar(+el.dataset.v); break;
    case "cerrarEstudio": ui.sesion = null; state.tarjetas.forEach(t=>delete t.fallo); commit(); cerrar(); break;
    case "nuevaAsig": formAsig(); break;
    case "editAsig": formAsig(id); break;
    case "nuevoTrab": formTrab(); break;
    case "editTrab": formTrab(id); break;
    case "nuevoExam": formExam(); break;
    case "editExam": formExam(id); break;
    case "nuevoHabito": formHabito(); break;
    case "editHabito": formHabito(id); break;
    case "borrar": {
      if (ui.armado !== id){ ui.armado = id; el.classList.add("armed"); el.textContent = "Toca otra vez para eliminar"; return; }
      if (tipo==="trab") state.trabajos = state.trabajos.filter(x=>x.id!==id);
      if (tipo==="exam") state.examenes = state.examenes.filter(x=>x.id!==id);
      if (tipo==="tarjeta") state.tarjetas = state.tarjetas.filter(x=>x.id!==id);
      if (tipo==="evento") state.eventos = state.eventos.filter(x=>x.id!==id);
      if (tipo==="reg") { state.ejercicio.registros = state.ejercicio.registros.filter(x=>x.id!==id); desanotar("ejer", id); }
      if (tipo==="tipo") { const ids = state.ejercicio.registros.filter(x=>x.tipo===id).map(x=>x.id);
        ids.forEach(r=>desanotar("ejer", r)); state.ejercicio.registros = state.ejercicio.registros.filter(x=>x.tipo!==id);
        state.ejercicio.tipos = state.ejercicio.tipos.filter(x=>x.id!==id); }
      if (tipo==="hab") { state.habitos = state.habitos.filter(x=>x.id!==id); delete state.marcas[id]; }
      if (tipo==="asig") { state.asignaturas = state.asignaturas.filter(x=>x.id!==id); state.tarjetas = state.tarjetas.filter(x=>x.asig!==id);
        state.trabajos = state.trabajos.filter(x=>x.asig!==id); state.examenes = state.examenes.filter(x=>x.asig!==id); ui.asig="todas"; }
      commit(); cerrar(); toast("Eliminado"); break; }
  }
});
document.addEventListener("submit", ev => {
  const f = ev.target.closest("form[data-f]"); if (!f) return;
  ev.preventDefault();
  const v = id => (document.getElementById(id)?.value ?? "").trim();
  const id = f.dataset.id, k = f.dataset.f;
  if (k==="login"){ const b = ev.submitter; if (b) b.disabled = true;
    entrar(v("f-email"), document.getElementById("f-clave").value, b && b.value==="up").finally(()=>{ if (b) b.disabled = false; }); return; }
  if (k==="nuevaClave"){ sb.auth.updateUser({ password: document.getElementById("f-clave").value }).then(({error}) => {
      if (error) toast("No se ha podido", errAuth(error)); else { cerrar(); toast("Contraseña cambiada"); } }); return; }
  const lineas = () => v("f-pasos").split("\n").map(s=>s.trim()).filter(Boolean).map(t=>({id:uid(), t, ok:false}));
  if (k==="asig"){ if(!v("f-nombre")) return;
    if (id) Object.assign(state.asignaturas.find(x=>x.id===id), {nombre:v("f-nombre"), color:v("f-color")});
    else { const n={id:uid(), nombre:v("f-nombre"), color:v("f-color")}; state.asignaturas.push(n); ui.asig=n.id; }
    commit(); cerrar(); }
  if (k==="trab"){ if(!v("f-titulo")||!v("f-fecha")) return;
    if (id) Object.assign(state.trabajos.find(x=>x.id===id), {titulo:v("f-titulo"), asig:v("f-asig"), fecha:v("f-fecha"), notas:v("f-notas")});
    else state.trabajos.push({id:uid(), titulo:v("f-titulo"), asig:v("f-asig"), fecha:v("f-fecha"), notas:v("f-notas"), subtareas:lineas(), hecho:false});
    commit(); cerrar(); toast(id?"Trabajo actualizado":"Trabajo añadido"); }
  if (k==="exam"){ if(!v("f-titulo")||!v("f-fecha")) return;
    if (id) Object.assign(state.examenes.find(x=>x.id===id), {titulo:v("f-titulo"), asig:v("f-asig"), fecha:v("f-fecha"), hora:v("f-hora"), notas:v("f-notas")});
    else state.examenes.push({id:uid(), titulo:v("f-titulo"), asig:v("f-asig"), fecha:v("f-fecha"), hora:v("f-hora"), notas:v("f-notas"), temas:lineas(), nota:"", hecho:false});
    commit(); cerrar(); toast(id?"Examen actualizado":"Examen añadido"); }
  if (k==="hab"){ if(!v("f-nombre")) return;
    if (id) Object.assign(state.habitos.find(x=>x.id===id), {nombre:v("f-nombre"), color:v("f-color")});
    else state.habitos.push({id:uid(), nombre:v("f-nombre"), color:v("f-color")});
    commit(); cerrar(); }
  if (k==="tarjeta"){ if(!v("f-frente")||!v("f-reverso")) return;
    const datos = {asig:v("f-asig"), f:v("f-frente"), b:v("f-reverso")};
    if (id) Object.assign(state.tarjetas.find(x=>x.id===id), datos);
    else state.tarjetas.push({id:uid(), ...datos, caja:0, due:hoy(), creada:hoy()});
    ui.asig = datos.asig;
    const otra = ev.submitter && ev.submitter.value==="1";
    commit();
    if (otra){ formTarjeta(); document.getElementById("f-asig").value = datos.asig; toast("Tarjeta guardada"); } else { cerrar(); if(!id) toast("Tarjeta creada", "Te tocará repasarla hoy"); }
  }
  if (k==="evento"){ if(!v("f-titulo")||!v("f-fecha")) return;
    const datos = {titulo:v("f-titulo"), fecha:v("f-fecha"), hora:v("f-hora"), color:v("f-color"), notas:v("f-notas")};
    if (id) Object.assign(state.eventos.find(x=>x.id===id), datos); else state.eventos.push({id:uid(), ...datos});
    ui.dia = datos.fecha; const dd = parse(datos.fecha); ui.mes = new Date(dd.getFullYear(), dd.getMonth(), 1);
    commit(); cerrar(); toast(id?"Plan actualizado":"Plan apuntado"); }
  if (k==="reg"){ if(!v("f-fecha")) return;
    const datos = {tipo:v("f-tipo"), fecha:v("f-fecha"), min:Math.max(0, parseInt(v("f-min"))||0), nota:v("f-notas")};
    if (id){ Object.assign(state.ejercicio.registros.find(x=>x.id===id), datos);
      const e = state.log.find(x=>x.k==="ejer" && x.r===id); if (e) e.d = datos.fecha; }
    else { const r = {id:uid(), ...datos}; state.ejercicio.registros.push(r); anotar("ejer", r.id, r.fecha); }
    commit(); cerrar(); if (!id) toast(`${tipoEj(datos.tipo).nombre} apuntado`, datos.min?`${datos.min} minutos`:""); }
  if (k==="tipo"){ if(!v("f-nombre")) return;
    const datos = {nombre:v("f-nombre"), color:v("f-color"), min:Math.max(0, parseInt(v("f-min"))||0)};
    if (id) Object.assign(state.ejercicio.tipos.find(x=>x.id===id), datos); else state.ejercicio.tipos.push({id:uid(), ...datos});
    commit(); cerrar(); }
  if (k==="addSub"){ const t = v("f-add"); if(!t) return;
    const o = (f.dataset.tipo==="trab"?state.trabajos:state.examenes).find(x=>x.id===id);
    (f.dataset.tipo==="trab"?o.subtareas:o.temas).push({id:uid(), t, ok:false});
    commit(); f.dataset.tipo==="trab"?verTrabajo(id):verExamen(id); document.getElementById("f-add")?.focus(); }
  if (k==="nota"){ state.examenes.find(x=>x.id===id).nota = v("f-nota"); commit(); toast("Nota guardada"); }
});
document.addEventListener("change", ev => {
  if (ev.target.id !== "f-restaurar" || !ev.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => { try { const d = JSON.parse(fr.result); if (!Array.isArray(d.asignaturas)) throw 0;
      state = completar(d); state.updatedAt = Date.now(); guardarLocal(); programarGuardado(); render(); toast("Copia restaurada"); }
    catch { toast("Ese archivo no es una copia de Sinapsis", "Elige el archivo sinapsis-copia-….json"); } };
  fr.readAsText(ev.target.files[0]);
});
document.addEventListener("keydown", e => { if (e.key==="Escape" && calmaVista){ abrirCalma(calmaVista==="menu"?null:"menu"); return; } });
document.addEventListener("keydown", e => { if (e.key==="Escape" && document.querySelector(".scrim") && !ui.conflicto) { if (ui.sesion){ ui.sesion=null; state.tarjetas.forEach(t=>delete t.fallo); commit(); } cerrar(); } });

/* ---------- Render ---------- */
function pintarSync(){
  const el = document.getElementById("sync"); if (!el) return;
  el.textContent = cuenta ? (modo==="db" ? "Sincronizado ✓" : "Sincronizando…") : (CUENTA_ACTIVA ? "Iniciar sesión" : "Guardado en este dispositivo");
  el.classList.toggle("on", CUENTA_ACTIVA && !cuenta);
  if (!CUENTA_ACTIVA) el.removeAttribute("data-a");
}
function render(){
  const vistas = {hoy:vistaHoy, uni:vistaUni, cal:vistaCal, hab:vistaHabitos, ejer:vistaEjer, prog:vistaProgreso};
  if (!vistas[ui.tab]) ui.tab = "hoy";
  document.getElementById("app").innerHTML = vistas[ui.tab]();
  document.getElementById("tabs").innerHTML = [["hoy","Hoy"],["uni","Uni"],["cal","Calendario"],["hab","Hábitos"],["ejer","Ejercicio"],["prog","Progreso"]]
    .map(([k,l])=>`<button data-a="tab" data-tab="${k}" class="${ui.tab===k?"on":""}" ${ui.tab===k?'aria-current="page"':""}>${ICON[k]}${l}</button>`).join("");
  pintarSync();
  if (ui.tab==="prog") dibujarRed(); else cancelAnimationFrame(netAnim);
}
addEventListener("resize", () => { if (ui.tab==="prog") dibujarRed(); });
try { localStorage.removeItem("sinapsis-faceid"); } catch {}
render();
conectar();
if (WEB && "serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch {} }
</script>
