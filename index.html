<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sinapsis">
<meta name="theme-color" content="#ECEEF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* En pantalla completa del iPhone, la barra de estado queda sobre el fondo de la app */
/* iOS a pantalla completa: sin esto la barra de abajo se queda flotando con un hueco debajo */
html{min-height:calc(100% + env(safe-area-inset-top,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}</style>
</head>
<body>
<title>Sinapsis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de móvil a una columna (máx. 560px), cabecera con saludo, tarjetas por bloque, barra de pestañas fija abajo. */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --surface-2:#F5F6F9; --ink:#161A26; --ink-2:#4A5163; --ink-3:#858B9B; --line:#DDE1E9;
  --accent:#E2553F; --accent-ink:#FFFFFF; --accent-soft:#FBE4DF;
  --ok:#14806F; --ok-soft:#D6EFEA; --flame:#E0892A; --flame-soft:#FBEBD5; --late:#B4361F;
  --shadow:0 1px 2px rgba(22,26,38,.06),0 6px 18px rgba(22,26,38,.06);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11131A; --surface:#1A1D27; --surface-2:#222633; --ink:#EEF0F5; --ink-2:#B3B8C6; --ink-3:#7E8495; --line:#2E3343;
  --accent:#F06A54; --accent-ink:#1A0E0B; --accent-soft:#3B221E;
  --ok:#3DBFA8; --ok-soft:#163430; --flame:#F2A64A; --flame-soft:#3A2B17; --late:#F08A72;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11131A; --surface:#1A1D27; --surface-2:#222633; --ink:#EEF0F5; --ink-2:#B3B8C6; --ink-3:#7E8495; --line:#2E3343;
  --accent:#F06A54; --accent-ink:#1A0E0B; --accent-soft:#3B221E;
  --ok:#3DBFA8; --ok-soft:#163430; --flame:#F2A64A; --flame-soft:#3A2B17; --late:#F08A72;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:20px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}

/* Cabecera */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.lvl-chip{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:0}
.lvl-chip b{font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.bar{height:6px;width:110px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.sync{font-size:11px;color:var(--ink-3)}

/* Tarjetas */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0;font-size:14px;color:var(--ink);flex:1 1 220px}

/* Cuenta atrás examen */
.exam-hero{position:relative;overflow:hidden;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:end;cursor:pointer;border:0;text-align:left;width:100%}
.exam-hero .eyebrow{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.exam-hero h3{margin:2px 0 0;font-family:var(--f-display);font-size:20px;line-height:1.15;font-weight:700}
.exam-hero .num{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.9;letter-spacing:-.03em;text-align:right;font-variant-numeric:tabular-nums}
.exam-hero .unit{font-size:12px;text-align:right;color:color-mix(in srgb,var(--bg) 70%,transparent)}
.exam-hero .meta{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:13px;color:color-mix(in srgb,var(--bg) 75%,transparent)}
.exam-hero .meta .bar{background:color-mix(in srgb,var(--bg) 22%,transparent);flex:1;width:auto}

/* Listas de pendientes */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.list .item:first-child{border-top:0}
.item .stripe{align-self:stretch;border-radius:4px}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .when{font-size:12px;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.when.late{color:var(--late)} .when.soon{color:var(--accent)} .when.ok{color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.tag.exam{background:var(--accent-soft);color:var(--accent)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.empty{padding:14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink-3);font-size:14px;text-align:center}

/* Hábitos */
.habit{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .habit:first-child{border-top:0}
.check{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;transition:transform .15s,background .2s,border-color .2s}
.check svg{width:22px;height:22px;opacity:0;transition:opacity .2s}
.check.on{background:var(--hc,var(--ok));border-color:var(--hc,var(--ok))}
.check.on svg{opacity:1;color:#fff}
.check:active{transform:scale(.92)}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:var(--flame);background:var(--flame-soft);padding:3px 8px;border-radius:99px;font-variant-numeric:tabular-nums}
.streak svg{width:13px;height:13px}
.streak.zero{color:var(--ink-3);background:var(--surface-2)}
.week{display:flex;gap:4px;margin-top:5px}
.week i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.week i.on{background:var(--hc,var(--ok))}
.week i.today{outline:1.5px solid var(--ink-3);outline-offset:1px}

/* Uni */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--ink-2)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{border-color:var(--ink);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink-2);padding:8px 6px}
.btn.danger{background:transparent;color:var(--late)}
.btn.danger.armed{background:var(--late);color:var(--surface)}
.btn svg{width:16px;height:16px}
details summary{cursor:pointer;color:var(--ink-2);font-weight:600;font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}

/* Progreso */
.net-wrap{position:relative;border-radius:var(--r);overflow:hidden;background:var(--ink);aspect-ratio:4/3;max-width:100%}
.net-wrap canvas{width:100%;height:100%;display:block}
.net-cap{position:absolute;left:14px;bottom:12px;right:14px;color:var(--bg);display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
.net-cap b{font-family:var(--f-display);font-size:30px;line-height:1;font-weight:800}
.net-cap span{font-size:12px;opacity:.75}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stage{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-3);min-width:0}
.stage i{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.stage i b{display:block;height:100%;background:var(--accent)}
.stage.cur{color:var(--ink);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border-radius:14px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;min-width:0}
.badge .n{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.2}
.badge .d{font-size:12px;color:var(--ink-3)}
.badge.on{background:var(--accent-soft)}
.badge.on .n{color:var(--accent)}
.badge .who{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.compound svg{width:100%;height:auto;display:block}
.bignum{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Calendario */
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-nav .btns{display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding-bottom:2px}
.day{min-height:64px;border:0;border-radius:10px;background:var(--surface-2);padding:5px 4px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;min-width:0;overflow:hidden}
.day .dn{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);line-height:1;padding:3px 4px;align-self:flex-start;border-radius:6px}
.day.out{background:transparent}
.day.out .dn{color:var(--ink-3);opacity:.55}
.day.today .dn{background:var(--accent);color:var(--accent-ink)}
.day.sel{outline:2px solid var(--ink);outline-offset:-2px}
.day .lbl{display:block;font-size:10px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:1px 4px;color:#fff}
.day .lbl.exam{font-weight:800}
.day .more{font-size:10px;color:var(--ink-3);font-weight:700;padding-left:2px}
.day .ex{display:flex;gap:2px;margin-top:auto;padding-left:2px}
.day .ex i{width:6px;height:6px;border-radius:50%}
@media (max-width:480px){.day .lbl{font-size:0;height:5px;padding:0}.day .lbl.exam{height:8px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:6px;border-radius:3px;display:inline-block;background:var(--ink-3)}
.legend i.big{height:9px}
.legend i.dot{width:7px;height:7px;border-radius:50%}
.evrow{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.list .evrow:first-child{border-top:0}
.evrow .stripe{align-self:stretch;border-radius:4px}

/* Ejercicio */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.qbtn{border:0;border-radius:14px;padding:12px;background:var(--surface-2);display:flex;align-items:center;gap:10px;text-align:left;font-weight:700;min-width:0}
.qbtn .ic{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:16px}
.qbtn .tx{display:flex;flex-direction:column;min-width:0}
.qbtn .tx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbtn small{font-weight:500;color:var(--ink-3);font-size:12px}
.qbtn.add{background:transparent;border:1.5px dashed var(--line);color:var(--ink-2);justify-content:center}
.qbtn.editing{outline:2px dashed var(--ink-3);outline-offset:-2px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 7px;border-radius:12px;background:var(--surface-2);min-width:0;border:0}
.wkd .l{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase}
.wkd .n{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.wkd .stack{display:flex;flex-direction:column-reverse;gap:3px;align-items:center;min-height:52px;justify-content:flex-start}
.wkd .stack i{width:20px;height:11px;border-radius:4px}
.wkd .min{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-height:12px}
.wkd.today{outline:2px solid var(--accent);outline-offset:-2px}
.wkd.future{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}
.bytype{display:flex;flex-direction:column;gap:8px}
.bt{display:grid;grid-template-columns:minmax(0,7.5em) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bt .trk{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bt .trk i{display:block;height:100%;border-radius:4px}
.bt .v{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.heat .c{aspect-ratio:1;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;max-width:100%;border:0;padding:0}
.heat .c.blank{background:transparent}
.heat .c.l1{background:color-mix(in srgb,var(--ok) 28%,var(--surface-2));color:var(--ink)}
.heat .c.l2{background:color-mix(in srgb,var(--ok) 58%,var(--surface-2));color:var(--ink)}
.heat .c.l3{background:var(--ok);color:var(--surface)}
.heat .c.today{outline:2px solid var(--accent);outline-offset:-2px}
.minis{display:flex;gap:8px;flex-wrap:wrap}

/* Barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;min-width:0;white-space:nowrap;font-weight:600;color:var(--ink-3);border-radius:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}

/* Hoja inferior (formularios y detalle) */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;font-size:16px;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;outline:2px solid transparent}
.sw.on{border-color:var(--surface);outline-color:var(--ink)}
.subs{display:flex;flex-direction:column;gap:2px}
.sub{display:flex;gap:10px;align-items:flex-start;padding:8px 0;background:none;border:0;text-align:left;width:100%}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.box svg{width:14px;height:14px;opacity:0}
.sub.on .box{background:var(--ok);border-color:var(--ok)}
.sub.on .box svg{opacity:1;color:#fff}
.sub.on span{color:var(--ink-3);text-decoration:line-through}
.addline{display:flex;gap:8px}
.addline input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:16px}
.detail-head{display:flex;flex-direction:column;gap:6px}
.detail-head h2{font-size:24px;line-height:1.15}
.pace{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink-2)}
.notes{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}

/* Aviso */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;width:min(92vw,420px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;animation:up .25s ease-out}
.toast b{font-family:var(--f-display);font-size:16px}
.toast span{font-size:13px;opacity:.85}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){h1{font-size:29px}.exam-hero .num{font-size:46px}.stages{grid-template-columns:repeat(2,1fr)}}
</style>

<div class="app" id="app"></div>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>

<script>
/* ============ Personaliza aquí ============ */
const NOMBRE = "Claudia";
const WEB = true; // true en la versión publicada fuera de Claude (activa la copia de seguridad)
// Mensajes que aparecen al desbloquear un logro o terminar un examen. Cámbialos por los tuyos.
const MENSAJES_LUIS = [
  "Sabía que lo ibas a conseguir. — Luis",
  "Una más. Qué orgulloso estoy de ti. — Luis",
  "Esto se merece un plan juntos este finde. — Luis",
  "Paso a paso, como siempre. Te quiero. — Luis"
];
/* ========================================= */

const COLORES = ["#E2553F","#3E7CE0","#14806F","#9B5DE5","#E0892A","#D6487E","#4A9E3B","#5C6B8A"];
const NIVELES = [
  {n:"Sensoriomotor", min:0},
  {n:"Preoperacional", min:150},
  {n:"Operaciones concretas", min:500},
  {n:"Operaciones formales", min:1200}
];
const XP = {sub:5, tema:5, trab:25, exam:40, hab:10, ejer:10};
const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-4 1-6.5 1-9.5z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  hoy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  uni:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>',
  hab:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3 1-5 1-8z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  ejer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  prog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="17" r="2.2"/><path d="M8 8l2.6 7M16.3 7.6l-3.1 7.6M8.2 7l7.6-.6"/></svg>'
};

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const hoy = () => iso(new Date());
const diasHasta = s => Math.round((Date.UTC(...s.split("-").map((v,i)=>i===1?v-1:+v)) - Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/864e5);
const fmtFecha = s => new Intl.DateTimeFormat("es-ES",{weekday:"short",day:"numeric",month:"short"}).format(parse(s));
const fmtLargo = d => new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long"}).format(d);
function cuando(s){
  const n = diasHasta(s);
  if (n < 0) return {txt: n===-1 ? "Ayer" : `Hace ${-n} d`, cls:"late"};
  if (n === 0) return {txt:"Hoy", cls:"soon"};
  if (n === 1) return {txt:"Mañana", cls:"soon"};
  if (n <= 7) return {txt:`En ${n} días`, cls:"soon"};
  return {txt: fmtFecha(s), cls:"ok"};
}
const lunes = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay()+6)%7)); };
const DOW = ["L","M","X","J","V","S","D"];
const fmtMes = d => { const t = new Intl.DateTimeFormat("es-ES",{month:"long", year:"numeric"}).format(d); return t.charAt(0).toUpperCase()+t.slice(1); };
const fmtDiaLargo = s => { const t = new Intl.DateTimeFormat("es-ES",{weekday:"long", day:"numeric", month:"long"}).format(parse(s)); return t.charAt(0).toUpperCase()+t.slice(1); };
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Datos iniciales: asignaturas de Claudia ---------- */
const ASIGNATURAS = [
  ["Psicología del Desarrollo", COLORES[0]],
  ["Psicología Social", COLORES[3]],
  ["Historia de la Psicología", COLORES[4]],
  ["Anatomía del Sistema Nervioso", COLORES[1]],
  ["Sensación, Percepción y Atención", COLORES[2]]
];
function tiposBase(){ return [
  {id:"x1", nombre:"Pilates", color:COLORES[5], min:50},
  {id:"x2", nombre:"Gimnasio", color:COLORES[1], min:60},
  {id:"x3", nombre:"Meditación", color:COLORES[3], min:10}
]; }
const inicial = () => ({v:1, ejemplo:false, asignaturas:ASIGNATURAS.map(([nombre,color])=>({id:uid(), nombre, color})), trabajos:[], examenes:[], habitos:[], marcas:{}, log:[], eventos:[], ejercicio:{tipos:tiposBase(), registros:[]}, vistos:[], updatedAt:Date.now()});
// Completa estados guardados con versiones anteriores de la app.
function completar(st){
  if (!st || st.ejemplo) return inicial();
  st.eventos = st.eventos || [];
  st.ejercicio = st.ejercicio || {tipos:tiposBase(), registros:[]};
  st.ejercicio.tipos = st.ejercicio.tipos || tiposBase();
  st.ejercicio.registros = st.ejercicio.registros || [];
  return st;
}

/* ---------- Guardado: cuenta de Claude si existe, si no, este dispositivo ---------- */
const LS_KEY = "sinapsis-estado-v1";
let state, ref = null, modo = "local", ultimaEscritura = 0, timerGuardar = null;
try { const raw = localStorage.getItem(LS_KEY); state = raw ? JSON.parse(raw) : inicial(); } catch { state = inicial(); }
state = completar(state);
let ui = {tab:"hoy", asig:"todas", armado:null, mes:new Date(new Date().getFullYear(), new Date().getMonth(), 1), dia:iso(new Date()), semana:lunes(new Date()), editTipos:false};
try { ui.tab = localStorage.getItem("sinapsis-tab") || "hoy"; } catch {}

function guardarLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {} }
function programarGuardado(){
  if (!ref) return;
  clearTimeout(timerGuardar);
  timerGuardar = setTimeout(async () => {
    ultimaEscritura = state.updatedAt;
    try { await ref.set({json: JSON.stringify(state), updatedAt: state.updatedAt}); modo = "db"; }
    catch (e) {
      if (e && e.code === "unavailable") { setTimeout(programarGuardado, 1500 + Math.random()*1500); return; }
      modo = "local"; ref = null;
    }
    pintarSync();
  }, 700);
}
async function conectar(){
  const use = window.claude && window.claude.use;
  if (!use) return;
  try {
    const [db, user] = await Promise.all([use("db"), use("user")]);
    const id = user ? await user.id() : null;
    if (!db || !id) return;
    ref = db.doc("data/users/" + id + "/sinapsis");
    const snap = await ref.get();
    if (snap.exists) {
      const remoto = JSON.parse(snap.data().json);
      if ((remoto.updatedAt||0) >= (state.updatedAt||0)) { state = completar(remoto); guardarLocal(); render(); }
      else programarGuardado();
    } else programarGuardado();
    modo = "db"; pintarSync();
    ref.onSnapshot(s => {
      if (!s.exists) return;
      const d = s.data();
      if (d.updatedAt > (state.updatedAt||0) && d.updatedAt !== ultimaEscritura) {
        try { state = completar(JSON.parse(d.json)); guardarLocal(); if (!document.querySelector(".scrim")) render(); } catch {}
      }
    }, () => {});
  } catch { ref = null; modo = "local"; pintarSync(); }
}
function commit(){
  state.updatedAt = Date.now();
  guardarLocal(); programarGuardado(); render(); revisarLogros();
}

/* ---------- Lógica ---------- */
const asig = id => state.asignaturas.find(a=>a.id===id) || {nombre:"Sin asignatura", color:"#858B9B"};
const xpTotal = () => state.log.reduce((s,e)=>s+(XP[e.k]||0),0);
function nivel(){
  const x = xpTotal(); let i = 0;
  NIVELES.forEach((l,j)=>{ if (x>=l.min) i=j; });
  const sig = NIVELES[i+1];
  const pct = sig ? (x-NIVELES[i].min)/(sig.min-NIVELES[i].min) : 1;
  return {i, nombre:NIVELES[i].n, xp:x, sig, pct};
}
function anotar(k, r, d){ state.log.push({d:d||hoy(), k, r}); if (state.log.length>3000) state.log.splice(0, state.log.length-3000); }
function desanotar(k, r){ for (let i=state.log.length-1;i>=0;i--) if (state.log[i].k===k && state.log[i].r===r){ state.log.splice(i,1); return; } }

// Racha con "día comodín": un día sin marcar por semana no la rompe.
function racha(hid){
  const set = new Set(state.marcas[hid]||[]);
  let d = new Date(), i = 0, n = 0, perdon = -99;
  if (!set.has(iso(d))) { d = addDays(d,-1); i = 1; }
  for (let guard=0; guard<1000; guard++){
    if (set.has(iso(d))) n++;
    else if (n>0 && i-perdon>=7 && set.has(iso(addDays(d,-1)))) perdon = i;
    else break;
    d = addDays(d,-1); i++;
  }
  return n;
}
const hechoHoy = hid => (state.marcas[hid]||[]).includes(hoy());
const diasActivos = () => new Set(state.log.filter(e=>e.k==="hab").map(e=>e.d)).size;
const pendientes = () => [
  ...state.trabajos.filter(t=>!t.hecho).map(t=>({tipo:"trab", o:t})),
  ...state.examenes.filter(e=>!e.hecho).map(e=>({tipo:"exam", o:e}))
].sort((a,b)=>a.o.fecha.localeCompare(b.o.fecha));
const progreso = arr => arr.length ? arr.filter(x=>x.ok).length/arr.length : 0;

/* ---------- Logros ---------- */
const LOGROS = [
  {id:"primera", who:"Ramón y Cajal", n:"Primera sinapsis", d:"Marca un hábito por primera vez", ok:()=>state.log.some(e=>e.k==="hab")},
  {id:"pavlov", who:"Pavlov", n:"Condicionamiento clásico", d:"Racha de 7 días en un hábito", ok:()=>state.habitos.some(h=>racha(h.id)>=7)},
  {id:"ebbinghaus", who:"Ebbinghaus", n:"Curva del olvido vencida", d:"Racha de 21 días en un hábito", ok:()=>state.habitos.some(h=>racha(h.id)>=21)},
  {id:"zeigarnik", who:"Zeigarnik", n:"Tarea cerrada", d:"Entrega tu primer trabajo", ok:()=>state.trabajos.some(t=>t.hecho)},
  {id:"yerkes", who:"Yerkes-Dodson", n:"Activación óptima", d:"Completa tu primer examen", ok:()=>state.examenes.some(e=>e.hecho)},
  {id:"skinner", who:"Skinner", n:"Refuerzo positivo", d:"100 hábitos marcados en total", ok:()=>state.log.filter(e=>e.k==="hab").length>=100},
  {id:"flow", who:"Csikszentmihalyi", n:"Estado de flow", d:"10 acciones en un mismo día", ok:()=>{ const c={}; state.log.forEach(e=>c[e.d]=(c[e.d]||0)+1); return Object.values(c).some(v=>v>=10); }},
  {id:"maslow", who:"Maslow", n:"Autorrealización", d:"Entrega 5 trabajos", ok:()=>state.trabajos.filter(t=>t.hecho).length>=5},
  {id:"bandura", who:"Bandura", n:"Autoeficacia", d:"Haz ejercicio 3 días en una misma semana", ok:()=>{ const s={}; state.ejercicio.registros.forEach(r=>{ const k=iso(lunes(parse(r.fecha))); (s[k]=s[k]||new Set()).add(r.fecha); }); return Object.values(s).some(x=>x.size>=3); }},
  {id:"piaget", who:"Piaget", n:"Operaciones formales", d:"Llega al último nivel", ok:()=>nivel().i===3}
];
function revisarLogros(){
  const nuevos = LOGROS.filter(l=>!state.vistos.includes(l.id) && l.ok());
  if (!nuevos.length) return;
  nuevos.forEach(l=>state.vistos.push(l.id));
  guardarLocal(); programarGuardado();
  const l = nuevos[0];
  toast(`Logro: ${l.n}`, MENSAJES_LUIS[Math.floor(Math.random()*MENSAJES_LUIS.length)]);
}
let toastT;
function toast(t, s){
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status");
  el.innerHTML = `<b>${esc(t)}</b>${s?`<span>${esc(s)}</span>`:""}`;
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(()=>el.remove(), 4200);
}

/* ---------- Vistas ---------- */
function cabecera(eyebrow, titulo){
  const nv = nivel();
  return `<header class="top"><div style="min-width:0"><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(titulo)}</h1></div>
    <div class="lvl-chip"><b>${esc(nv.nombre)}</b><div class="bar"><i style="width:${Math.round(nv.pct*100)}%"></i></div><span class="sync" id="sync"></span></div></header>
`;
}
function itemPendiente({tipo,o}){
  const a = asig(o.asig), c = o.hecho ? {txt: tipo==="exam" && o.nota ? `Nota: ${o.nota}` : (tipo==="exam"?"Hecho":"Entregado"), cls:"ok"} : cuando(o.fecha);
  const arr = tipo==="trab" ? o.subtareas : o.temas;
  const prog = arr.length ? `${arr.filter(x=>x.ok).length}/${arr.length}` : "";
  return `<button class="item" data-a="ver" data-tipo="${tipo}" data-id="${o.id}">
    <span class="stripe" style="background:${a.color}"></span>
    <span style="min-width:0;display:flex;flex-direction:column;gap:2px"><span class="t">${esc(o.titulo)}</span>
      <span class="s"><span class="tag ${tipo==="exam"?"exam":""}">${tipo==="exam"?"Examen":"Trabajo"}</span>${esc(a.nombre)}${prog?` · ${prog}`:""}</span></span>
    <span class="when ${c.cls}">${c.txt}</span></button>`;
}
function filaHabito(h, editable){
  const on = hechoHoy(h.id), r = racha(h.id), set = new Set(state.marcas[h.id]||[]);
  const semana = Array.from({length:7},(_,k)=>{ const ds = iso(addDays(new Date(), k-6)); return `<i class="${set.has(ds)?"on":""} ${k===6?"today":""}"></i>`; }).join("");
  return `<div class="habit" style="--hc:${h.color}">
    <button class="check ${on?"on":""}" data-a="marcar" data-id="${h.id}" aria-pressed="${on}" aria-label="Marcar ${esc(h.nombre)} hoy">${ICON.check}</button>
    <div style="min-width:0">${editable?`<button class="btn ghost" style="padding:0;font-weight:600;color:var(--ink);text-align:left" data-a="editHabito" data-id="${h.id}" title="Editar">${esc(h.nombre)}</button>`:`<div class="t" style="font-weight:600;overflow-wrap:anywhere">${esc(h.nombre)}</div>`}<div class="week" aria-hidden="true">${semana}</div></div>
    <span class="streak ${r?"":"zero"}" title="Racha actual">${ICON.flame}${r}</span></div>`;
}

function vistaHoy(){
  const pend = pendientes();
  const exam = pend.find(p=>p.tipo==="exam");
  const semana = pend.filter(p=>diasHasta(p.o.fecha)<=7);
  const planes = state.eventos.filter(v=>{ const n = diasHasta(v.fecha); return n>=0 && n<=7; }).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  const ejHoy = state.ejercicio.registros.filter(r=>r.fecha===hoy());
  const hechos = state.habitos.filter(h=>hechoHoy(h.id)).length;
  const saludo = new Date().getHours()<13 ? "Buenos días" : new Date().getHours()<21 ? "Buenas tardes" : "Buenas noches";
  let h = cabecera(fmtLargo(new Date()), `${saludo}, ${NOMBRE}`);
  if (exam){
    const e = exam.o, n = diasHasta(e.fecha), p = progreso(e.temas);
    h += `<button class="exam-hero" data-a="ver" data-tipo="exam" data-id="${e.id}">
      <div style="min-width:0"><div class="eyebrow">Próximo examen · ${esc(asig(e.asig).nombre)}</div><h3>${esc(e.titulo)}</h3></div>
      <div><div class="num">${Math.max(n,0)}</div><div class="unit">${n===1?"día":"días"}</div></div>
      <div class="meta"><span>${e.temas.filter(t=>t.ok).length} de ${e.temas.length} temas</span><div class="bar"><i style="width:${Math.round(p*100)}%"></i></div></div></button>`;
  }
  h += `<section class="card"><div class="sec-head"><h2>Esta semana</h2><button class="btn ghost" data-a="tab" data-tab="uni">Ver todo</button></div>
    ${semana.length||planes.length ? `<div class="list">${[...semana.map(p=>({f:p.o.fecha, h:itemPendiente(p)})), ...planes.map(v=>({f:v.fecha, h:itemEvento(v)}))].sort((a,b)=>a.f.localeCompare(b.f)).map(x=>x.h).join("")}</div>` : `<div class="empty">Nada en los próximos 7 días.</div>`}</section>`;
  h += `<section class="card"><div class="sec-head"><h2>Hábitos de hoy</h2><span class="muted small">${hechos}/${state.habitos.length}</span></div>
    ${state.habitos.length ? `<div class="list">${state.habitos.map(hb=>filaHabito(hb)).join("")}</div>` : `<div class="empty">Aún no tienes hábitos. <button class="btn ghost" data-a="nuevoHabito">Crear el primero</button></div>`}</section>`;
  h += `<section class="card"><div class="sec-head"><h2>Ejercicio de hoy</h2><button class="btn ghost" data-a="tab" data-tab="ejer">Ver semana</button></div>
    ${ejHoy.length ? `<div class="list">${ejHoy.map(r=>itemRegistro(r,false)).join("")}</div>` : ""}
    <div class="minis">${state.ejercicio.tipos.map(t=>`<button class="chip" data-a="registrar" data-id="${t.id}"><span class="dot" style="background:${t.color}"></span>${esc(t.nombre)}</button>`).join("")}</div></section>`;
  return h;
}

function vistaUni(){
  let h = cabecera("Universidad", "Tus asignaturas");
  h += `<div class="chips" role="tablist"><button class="chip ${ui.asig==="todas"?"on":""}" data-a="filtro" data-id="todas">Todas</button>
    ${state.asignaturas.map(a=>`<button class="chip ${ui.asig===a.id?"on":""}" data-a="filtro" data-id="${a.id}"><span class="dot" style="background:${a.color}"></span>${esc(a.nombre)}</button>`).join("")}
    <button class="chip" data-a="nuevaAsig">${ICON.plus.replace('<svg','<svg width="14" height="14"')}Asignatura</button></div>`;
  h += `<div class="actions"><button class="btn primary" data-a="nuevoTrab">${ICON.plus}Trabajo</button><button class="btn primary" data-a="nuevoExam">${ICON.plus}Examen</button>
    ${ui.asig!=="todas" ? `<button class="btn ghost" data-a="editAsig" data-id="${ui.asig}">Editar asignatura</button>` : ""}</div>`;
  const f = x => ui.asig==="todas" || x.asig===ui.asig;
  const pend = pendientes().filter(p=>f(p.o));
  const hechos = [...state.trabajos.filter(t=>t.hecho&&f(t)).map(o=>({tipo:"trab",o})), ...state.examenes.filter(e=>e.hecho&&f(e)).map(o=>({tipo:"exam",o}))]
    .sort((a,b)=>b.o.fecha.localeCompare(a.o.fecha));
  h += `<section class="card"><div class="sec-head"><h2>Pendiente</h2><span class="muted small">${pend.length}</span></div>
    ${pend.length ? `<div class="list">${pend.map(itemPendiente).join("")}</div>` : `<div class="empty">${state.asignaturas.length ? "Todo al día. Añade un trabajo o un examen cuando te lo manden." : "Empieza añadiendo tus asignaturas."}</div>`}</section>`;
  if (hechos.length) h += `<section class="card"><details><summary>Hecho (${hechos.length})</summary><div class="list" style="margin-top:8px">${hechos.map(itemPendiente).join("")}</div></details></section>`;
  return h;
}

function vistaHabitos(){
  let h = cabecera("Hábitos", "1% mejor cada día");
  h += `<section class="card"><div class="sec-head"><h2>Hoy</h2><button class="btn primary" data-a="nuevoHabito">${ICON.plus}Hábito</button></div>
    ${state.habitos.length ? `<div class="list">${state.habitos.map(h=>filaHabito(h,true)).join("")}</div>`
      : `<div class="empty">Añade algo pequeño que quieras hacer cada día.</div>`}
    <p class="muted small" style="margin:0">Toca el nombre de un hábito para editarlo. Un día de descanso por semana no rompe la racha.</p></section>`;
  const n = diasActivos(), mult = Math.pow(1.01, n);
  h += `<section class="card compound"><div class="sec-head"><h2>Efecto compuesto</h2><span class="muted small">${n} días activos</span></div>
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="bignum">×${mult.toFixed(2)}</span><span class="muted small">si mejoras un 1% cada día activo. En un año serían ×37,8.</span></div>
    ${curvaSVG(n)}</section>`;

}
function curvaSVG(n){
  const W=320,H=120,L=8,R=8,T=10,B=22, max=Math.log(Math.pow(1.01,365));
  const x = d => L + d/365*(W-L-R), y = d => T + (1 - Math.log(Math.pow(1.01,d))/max)*(H-T-B);
  let p=""; for(let d=0; d<=365; d+=5) p += (d?"L":"M")+x(d).toFixed(1)+","+y(d).toFixed(1);
  const cn = Math.min(n,365);
  let pa=""; for(let d=0; d<=cn; d+=1) pa += (d?"L":"M")+x(d).toFixed(1)+","+y(d).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de mejora del 1% diario durante un año">
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)" stroke-width="1"/>
    <path d="${p}" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 4"/>
    ${cn>0?`<path d="${pa}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>`:""}
    <circle cx="${x(cn)}" cy="${y(cn)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--ink-3)">Día 0</text>
    <text x="${W-R}" y="${H-6}" font-size="10" fill="var(--ink-3)" text-anchor="end">Día 365</text></svg>`;
}

/* ---------- Red neuronal (canvas) ---------- */
let netAnim;
function dibujarRed(){
  cancelAnimationFrame(netAnim);
  const cv = document.getElementById("net"); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const W = r.width, H = r.height, css = getComputedStyle(document.documentElement);
  const colK = {ejer:"#3E7CE0", hab:css.getPropertyValue("--flame").trim(), sub:css.getPropertyValue("--ok").trim(), tema:css.getPropertyValue("--ok").trim(), trab:css.getPropertyValue("--accent").trim(), exam:css.getPropertyValue("--accent").trim()};
  const bgInk = css.getPropertyValue("--bg").trim();
  let seed = 7; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;
  const ev = state.log.slice(-180);
  const nodes = ev.map((e,i)=>{ let x,y; do { x=rnd()*2-1; y=rnd()*2-1; } while (x*x+y*y>1);
    return {x: W/2 + x*W*0.42, y: (H-40)/2 + y*(H-40)*0.42 + 6, c: colK[e.k]||bgInk, big: e.k==="trab"||e.k==="exam"}; });
  const edges = [];
  nodes.forEach((n,i)=>{ const near = nodes.slice(0,i).map((m,j)=>({j,d:(m.x-n.x)**2+(m.y-n.y)**2})).sort((a,b)=>a.d-b.d).slice(0,2); near.forEach(o=>edges.push([i,o.j])); });
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let pulses = [];
  function frame(t){
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth = 1; ctx.strokeStyle = bgInk; ctx.globalAlpha = .16;
    edges.forEach(([a,b])=>{ ctx.beginPath(); ctx.moveTo(nodes[a].x,nodes[a].y); ctx.lineTo(nodes[b].x,nodes[b].y); ctx.stroke(); });
    ctx.globalAlpha = 1;
    if (!reduce && edges.length){
      if (pulses.length < 6 && Math.random()<.05) pulses.push({e:edges[Math.floor(Math.random()*edges.length)], p:0});
      pulses = pulses.filter(p=>p.p<1);
      pulses.forEach(p=>{ p.p += .012; const a=nodes[p.e[0]], b=nodes[p.e[1]];
        ctx.beginPath(); ctx.fillStyle = a.c; ctx.globalAlpha = 1-p.p; ctx.arc(a.x+(b.x-a.x)*p.p, a.y+(b.y-a.y)*p.p, 2.2, 0, 7); ctx.fill(); });
      ctx.globalAlpha = 1;
    }
    nodes.forEach((n,i)=>{ const s = n.big?4.5:2.8; const pulse = reduce?0:Math.sin(t/700+i)*.5;
      ctx.beginPath(); ctx.fillStyle = n.c; ctx.arc(n.x,n.y,s+pulse,0,7); ctx.fill(); });
    if (!nodes.length){ ctx.fillStyle = bgInk; ctx.globalAlpha=.6; ctx.font = "14px Figtree, sans-serif"; ctx.textAlign="center"; ctx.fillText("Cada cosa que hagas creará una conexión", W/2, H/2-10); ctx.globalAlpha=1; }
    if (!reduce) netAnim = requestAnimationFrame(frame);
  }
  netAnim = requestAnimationFrame(frame);
}

    ${ritmo?`<div class="pace">${ritmo}</div>`:""}
    <div><div class="sec-head"><h2 style="font-size:16px">Temas</h2><span class="muted small">${e.temas.filter(s=>s.ok).length}/${e.temas.length} repasados</span></div>
    <div class="subs">${e.temas.map(s=>`<button class="sub ${s.ok?"on":""}" data-a="sub" data-tipo="exam" data-id="${e.id}" data-s="${s.id}"><span class="box">${ICON.check}</span><span>${esc(s.t)}</span></button>`).join("")}</div>
    <form class="addline" data-f="addSub" data-tipo="exam" data-id="${e.id}"><input id="f-add" placeholder="Añadir un tema" aria-label="Nuevo tema"><button class="btn">Añadir</button></form></div>
    ${e.notas?`<div class="notes">${esc(e.notas)}</div>`:""}
    ${e.hecho?`<form class="field" data-f="nota" data-id="${e.id}"><label for="f-nota">Nota obtenida</label><div class="addline"><input id="f-nota" inputmode="decimal" value="${esc(e.nota)}" placeholder="Ej. 8,5"><button class="btn">Guardar</button></div></form>`:""}
    <div class="actions"><button class="btn primary" data-a="hecho" data-tipo="exam" data-id="${e.id}">${e.hecho?"Marcar como pendiente":"Ya lo he hecho"}</button>
    <button class="btn" data-a="editExam" data-id="${e.id}">Editar</button>${botonBorrar("exam",e.id)}</div>`);
}

function formAsig(id){
  const a = state.asignaturas.find(x=>x.id===id) || {nombre:"", color:COLORES[state.asignaturas.length%COLORES.length]};
  abrir(`<h2>${id?"Editar asignatura":"Nueva asignatura"}</h2><form data-f="asig" data-id="${id||""}" style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="f-nombre">Nombre</label><input id="f-nombre" required value="${esc(a.nombre)}" placeholder="Ej. Psicología del Desarrollo"></div>
    <div class="field"><label>Color</label>${swatches(a.color)}</div>
    <div class="actions"><button class="btn primary">Guardar</button>${id?botonBorrar("asig",id):""}</div></form>`);
}
function formTrab(id){
  if (!state.asignaturas.length) return formAsig();
  const t = state.trabajos.find(x=>x.id===id) || {titulo:"", asig: ui.asig!=="todas"?ui.asig:state.asignaturas[0].id, fecha:iso(addDays(new Date(),7)), notas:"", subtareas:[]};
  abrir(`<h2>${id?"Editar trabajo":"Nuevo trabajo"}</h2><form data-f="trab" data-id="${id||""}" style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="f-titulo">Título</label><input id="f-titulo" required value="${esc(t.titulo)}" placeholder="Ej. Informe de prácticas"></div>
    <div class="row2"><div class="field"><label for="f-asig">Asignatura</label><select id="f-asig">${optsAsig(t.asig)}</select></div>
    <div class="field"><label for="f-fecha">Entrega</label><input id="f-fecha" type="date" required value="${t.fecha}"></div></div>
    ${id?"":`<div class="field"><label for="f-pasos">Pasos (uno por línea, opcional)</label><textarea id="f-pasos" placeholder="Buscar bibliografía&#10;Redactar&#10;Revisar"></textarea></div>`}
    <div class="field"><label for="f-notas">Notas</label><textarea id="f-notas" placeholder="Formato, extensión, compañeros…">${esc(t.notas)}</textarea></div>
    <div class="actions"><button class="btn primary">Guardar</button></div></form>`);
}
function formExam(id){
  if (!state.asignaturas.length) return formAsig();
  const e = state.examenes.find(x=>x.id===id) || {titulo:"", asig: ui.asig!=="todas"?ui.asig:state.asignaturas[0].id, fecha:iso(addDays(new Date(),14)), hora:"", notas:"", temas:[]};
  abrir(`<h2>${id?"Editar examen":"Nuevo examen"}</h2><form data-f="exam" data-id="${id||""}" style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="f-titulo">Título</label><input id="f-titulo" required value="${esc(e.titulo)}" placeholder="Ej. Parcial 1"></div>
    <div class="field"><label for="f-asig">Asignatura</label><select id="f-asig">${optsAsig(e.asig)}</select></div>
    <div class="row2"><div class="field"><label for="f-fecha">Fecha</label><input id="f-fecha" type="date" required value="${e.fecha}"></div>
    <div class="field"><label for="f-hora">Hora</label><input id="f-hora" type="time" value="${esc(e.hora)}"></div></div>
    ${id?"":`<div class="field"><label for="f-pasos">Temas que entran (uno por línea)</label><textarea id="f-pasos" placeholder="Tema 1. Introducción&#10;Tema 2. …"></textarea></div>`}
    <div class="field"><label for="f-notas">Notas</label><textarea id="f-notas" placeholder="Tipo de examen, aula, material…">${esc(e.notas)}</textarea></div>
    <div class="actions"><button class="btn primary">Guardar</button></div></form>`);
}
function formHabito(id){
  const h = state.habitos.find(x=>x.id===id) || {nombre:"", color:COLORES[state.habitos.length%COLORES.length]};
  abrir(`<h2>${id?"Editar hábito":"Nuevo hábito"}</h2><form data-f="hab" data-id="${id||""}" style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="f-nombre">¿Qué quieres hacer cada día?</label><input id="f-nombre" required value="${esc(h.nombre)}" placeholder="Ej. Meditar 5 minutos"></div>
    <div class="field"><label>Color</label>${swatches(h.color)}</div>
    <div class="actions"><button class="btn primary">Guardar</button>${id?botonBorrar("hab",id):""}</div></form>`);
}


function formEvento(id, fecha){
  const v = state.eventos.find(x=>x.id===id) || {titulo:"", fecha:fecha||hoy(), hora:"", color:COLORES[5], notas:""};
  abrir(`<h2>${id?"Editar plan":"Nuevo plan"}</h2><form data-f="evento" data-id="${id||""}" style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="f-titulo">¿Qué es?</label><input id="f-titulo" required value="${esc(v.titulo)}" placeholder="Ej. Cena con las de clase, dentista, cumpleaños…"></div>
    <div class="row2"><div class="field"><label for="f-fecha">Día</label><input id="f-fecha" type="date" required value="${v.fecha}"></div>
    <div class="field"><label for="f-hora">Hora (opcional)</label><input id="f-hora" type="time" value="${esc(v.hora)}"></div></div>
    <div class="field"><label>Color</label>${swatches(v.color)}</div>
    <div class="field"><label for="f-notas">Notas</label><textarea id="f-notas" style="min-height:60px">${esc(v.notas)}</textarea></div>
    <div class="actions"><button class="btn primary">Guardar</button>${id?botonBorrar("evento",id):""}</div></form>`);
}
function formRegistro(tipoId, id){
  const r = state.ejercicio.registros.find(x=>x.id===id) || {tipo:tipoId, fecha:hoy(), min:tipoEj(tipoId).min, nota:""};
  const t = tipoEj(r.tipo);
  abrir(`<h2>${id?"Editar sesión":esc(t.nombre)}</h2><form data-f="reg" data-id="${id||""}" style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="f-tipo">Actividad</label><select id="f-tipo">${state.ejercicio.tipos.map(x=>`<option value="${x.id}" ${x.id===r.tipo?"selected":""}>${esc(x.nombre)}</option>`).join("")}</select></div>
    <div class="row2"><div class="field"><label for="f-fecha">Día</label><input id="f-fecha" type="date" required value="${r.fecha}" max="${hoy()}"></div>
    <div class="field"><label for="f-min">Minutos</label><input id="f-min" type="number" inputmode="numeric" min="0" max="600" value="${esc(r.min)}"></div></div>
    <div class="field"><label for="f-notas">¿Qué tal? (opcional)</label><input id="f-notas" value="${esc(r.nota)}" placeholder="Ej. clase de reformer, pierna, 10 min de respiración"></div>
    <div class="actions"><button class="btn primary">${id?"Guardar":"Apuntar"}</button>${id?botonBorrar("reg",id):""}</div></form>`);
}
function formTipo(id){
  const t = state.ejercicio.tipos.find(x=>x.id===id) || {nombre:"", color:COLORES[(state.ejercicio.tipos.length+2)%COLORES.length], min:30};
  abrir(`<h2>${id?"Editar actividad":"Nueva actividad"}</h2><form data-f="tipo" data-id="${id||""}" style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="f-nombre">Nombre</label><input id="f-nombre" required value="${esc(t.nombre)}" placeholder="Ej. Yoga, correr, nadar…"></div>
    <div class="field"><label for="f-min">Duración habitual (min)</label><input id="f-min" type="number" inputmode="numeric" min="0" max="600" value="${esc(t.min)}"></div>
    <div class="field"><label>Color</label>${swatches(t.color)}</div>
    <div class="actions"><button class="btn primary">Guardar</button>${id?botonBorrar("tipo",id):""}</div></form>`);
}

/* ---------- Eventos ---------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id, tipo = el.dataset.tipo;
  if (a==="cerrarFondo"){ if (ev.target===el) cerrar(); return; }
  if (a!=="borrar") ui.armado = null;
  switch(a){
    case "tab": ui.tab = el.dataset.tab; try{localStorage.setItem("sinapsis-tab",ui.tab);}catch{} render(); scrollTo(0,0); break;
    case "filtro": ui.asig = id; render(); break;
    case "ver": tipo==="trab" ? verTrabajo(id) : verExamen(id); break;
    case "marcar": {
      const m = state.marcas[id] = state.marcas[id]||[], d = hoy(), r = id+"@"+d;
      if (m.includes(d)) { m.splice(m.indexOf(d),1); desanotar("hab", r); } else { m.push(d); anotar("hab", r); }
      commit(); break; }
    case "sub": {
      const o = (tipo==="trab"?state.trabajos:state.examenes).find(x=>x.id===id);
      const s = (tipo==="trab"?o.subtareas:o.temas).find(x=>x.id===el.dataset.s);
      s.ok = !s.ok; const k = tipo==="trab"?"sub":"tema"; s.ok ? anotar(k,s.id) : desanotar(k,s.id);
      commit(); tipo==="trab"?verTrabajo(id):verExamen(id); break; }
    case "hecho": {
      const o = (tipo==="trab"?state.trabajos:state.examenes).find(x=>x.id===id);
      o.hecho = !o.hecho; o.hecho ? anotar(tipo,o.id) : desanotar(tipo,o.id);
      if (o.hecho) toast(tipo==="trab"?"Trabajo entregado":"Examen hecho", MENSAJES_LUIS[Math.floor(Math.random()*MENSAJES_LUIS.length)]);
      commit();
      tipo==="trab"?verTrabajo(id):verExamen(id); break; }
    case "color": document.getElementById("f-color").value = el.dataset.c;
      el.parentElement.querySelectorAll(".sw").forEach(s=>{ s.classList.toggle("on", s===el); s.setAttribute("aria-checked", s===el); }); break;
    case "mes": ui.mes = new Date(ui.mes.getFullYear(), ui.mes.getMonth()+(+el.dataset.d), 1); render(); break;
    case "mesHoy": ui.mes = new Date(new Date().getFullYear(), new Date().getMonth(), 1); ui.dia = hoy(); render(); break;
    case "dia": { ui.dia = el.dataset.d; const d = parse(ui.dia); if (d.getMonth()!==ui.mes.getMonth()) ui.mes = new Date(d.getFullYear(), d.getMonth(), 1); render(); break; }
    case "irDia": { ui.dia = el.dataset.d; const d = parse(ui.dia); ui.mes = new Date(d.getFullYear(), d.getMonth(), 1); ui.tab = "cal"; try{localStorage.setItem("sinapsis-tab",ui.tab);}catch{} render(); scrollTo(0,0); break; }
    case "sem": ui.semana = addDays(ui.semana, +el.dataset.d); render(); break;
    case "nuevoEvento": formEvento(null, el.dataset.d); break;
    case "editEvento": formEvento(id); break;
    case "registrar": formRegistro(id); break;
    case "editReg": formRegistro(null, id); break;
    case "editTipos": ui.editTipos = !ui.editTipos; render(); break;
    case "nuevoTipo": formTipo(); break;
    case "editTipo": formTipo(id); break;
    case "exportar": {
      const blob = new Blob([JSON.stringify(state)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `sinapsis-copia-${hoy()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      toast("Copia descargada", "Guárdala en Archivos o iCloud Drive."); break; }
    case "nuevaAsig": formAsig(); break;
    case "editAsig": formAsig(id); break;
    case "nuevoTrab": formTrab(); break;
    case "editTrab": formTrab(id); break;
    case "nuevoExam": formExam(); break;
    case "editExam": formExam(id); break;
    case "nuevoHabito": formHabito(); break;
    case "editHabito": formHabito(id); break;
    case "borrar": {
      if (ui.armado !== id){ ui.armado = id; el.classList.add("armed"); el.textContent = "Toca otra vez para eliminar"; return; }
      if (tipo==="trab") state.trabajos = state.trabajos.filter(x=>x.id!==id);
      if (tipo==="exam") state.examenes = state.examenes.filter(x=>x.id!==id);
      if (tipo==="evento") state.eventos = state.eventos.filter(x=>x.id!==id);
      if (tipo==="reg") { state.ejercicio.registros = state.ejercicio.registros.filter(x=>x.id!==id); desanotar("ejer", id); }
      if (tipo==="tipo") { const ids = state.ejercicio.registros.filter(x=>x.tipo===id).map(x=>x.id);
        ids.forEach(r=>desanotar("ejer", r)); state.ejercicio.registros = state.ejercicio.registros.filter(x=>x.tipo!==id);
        state.ejercicio.tipos = state.ejercicio.tipos.filter(x=>x.id!==id); }
      if (tipo==="hab") { state.habitos = state.habitos.filter(x=>x.id!==id); delete state.marcas[id]; }
      if (tipo==="asig") { state.asignaturas = state.asignaturas.filter(x=>x.id!==id);
        state.trabajos = state.trabajos.filter(x=>x.asig!==id); state.examenes = state.examenes.filter(x=>x.asig!==id); ui.asig="todas"; }
      commit(); cerrar(); toast("Eliminado"); break; }
  }
});
document.addEventListener("submit", ev => {
  const f = ev.target.closest("form[data-f]"); if (!f) return;
  ev.preventDefault();
  const v = id => (document.getElementById(id)?.value ?? "").trim();
  const id = f.dataset.id, k = f.dataset.f;
  const lineas = () => v("f-pasos").split("\n").map(s=>s.trim()).filter(Boolean).map(t=>({id:uid(), t, ok:false}));
  if (k==="asig"){ if(!v("f-nombre")) return;
    if (id) Object.assign(state.asignaturas.find(x=>x.id===id), {nombre:v("f-nombre"), color:v("f-color")});
    else { const n={id:uid(), nombre:v("f-nombre"), color:v("f-color")}; state.asignaturas.push(n); ui.asig=n.id; }
    commit(); cerrar(); }
  if (k==="trab"){ if(!v("f-titulo")||!v("f-fecha")) return;
    if (id) Object.assign(state.trabajos.find(x=>x.id===id), {titulo:v("f-titulo"), asig:v("f-asig"), fecha:v("f-fecha"), notas:v("f-notas")});
    else state.trabajos.push({id:uid(), titulo:v("f-titulo"), asig:v("f-asig"), fecha:v("f-fecha"), notas:v("f-notas"), subtareas:lineas(), hecho:false});
    commit(); cerrar(); toast(id?"Trabajo actualizado":"Trabajo añadido"); }
  if (k==="exam"){ if(!v("f-titulo")||!v("f-fecha")) return;
    if (id) Object.assign(state.examenes.find(x=>x.id===id), {titulo:v("f-titulo"), asig:v("f-asig"), fecha:v("f-fecha"), hora:v("f-hora"), notas:v("f-notas")});
    else state.examenes.push({id:uid(), titulo:v("f-titulo"), asig:v("f-asig"), fecha:v("f-fecha"), hora:v("f-hora"), notas:v("f-notas"), temas:lineas(), nota:"", hecho:false});
    commit(); cerrar(); toast(id?"Examen actualizado":"Examen añadido"); }
  if (k==="hab"){ if(!v("f-nombre")) return;
    if (id) Object.assign(state.habitos.find(x=>x.id===id), {nombre:v("f-nombre"), color:v("f-color")});
    else state.habitos.push({id:uid(), nombre:v("f-nombre"), color:v("f-color")});
    commit(); cerrar(); }
  if (k==="evento"){ if(!v("f-titulo")||!v("f-fecha")) return;
    const datos = {titulo:v("f-titulo"), fecha:v("f-fecha"), hora:v("f-hora"), color:v("f-color"), notas:v("f-notas")};
    if (id) Object.assign(state.eventos.find(x=>x.id===id), datos); else state.eventos.push({id:uid(), ...datos});
    ui.dia = datos.fecha; const dd = parse(datos.fecha); ui.mes = new Date(dd.getFullYear(), dd.getMonth(), 1);
    commit(); cerrar(); toast(id?"Plan actualizado":"Plan apuntado"); }
  if (k==="reg"){ if(!v("f-fecha")) return;
    const datos = {tipo:v("f-tipo"), fecha:v("f-fecha"), min:Math.max(0, parseInt(v("f-min"))||0), nota:v("f-notas")};
    if (id){ Object.assign(state.ejercicio.registros.find(x=>x.id===id), datos);
      const e = state.log.find(x=>x.k==="ejer" && x.r===id); if (e) e.d = datos.fecha; }
    else { const r = {id:uid(), ...datos}; state.ejercicio.registros.push(r); anotar("ejer", r.id, r.fecha); }
    commit(); cerrar(); if (!id) toast(`${tipoEj(datos.tipo).nombre} apuntado`, datos.min?`${datos.min} minutos`:""); }
  if (k==="tipo"){ if(!v("f-nombre")) return;
    const datos = {nombre:v("f-nombre"), color:v("f-color"), min:Math.max(0, parseInt(v("f-min"))||0)};
    if (id) Object.assign(state.ejercicio.tipos.find(x=>x.id===id), datos); else state.ejercicio.tipos.push({id:uid(), ...datos});
    commit(); cerrar(); }
  if (k==="addSub"){ const t = v("f-add"); if(!t) return;
    const o = (f.dataset.tipo==="trab"?state.trabajos:state.examenes).find(x=>x.id===id);
    (f.dataset.tipo==="trab"?o.subtareas:o.temas).push({id:uid(), t, ok:false});
    commit(); f.dataset.tipo==="trab"?verTrabajo(id):verExamen(id); document.getElementById("f-add")?.focus(); }
  if (k==="nota"){ state.examenes.find(x=>x.id===id).nota = v("f-nota"); commit(); toast("Nota guardada"); }
});
document.addEventListener("change", ev => {
  if (ev.target.id !== "f-restaurar" || !ev.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => { try { const d = JSON.parse(fr.result); if (!Array.isArray(d.asignaturas)) throw 0;
      state = completar(d); state.updatedAt = Date.now(); guardarLocal(); render(); toast("Copia restaurada"); }
    catch { toast("Ese archivo no es una copia de Sinapsis", "Elige el archivo sinapsis-copia-….json"); } };
  fr.readAsText(ev.target.files[0]);
});
document.addEventListener("keydown", e => { if (e.key==="Escape" && document.querySelector(".scrim")) cerrar(); });

/* ---------- Render ---------- */
function pintarSync(){
  const el = document.getElementById("sync"); if (!el) return;
  el.textContent = modo==="db" ? "Guardado en tu cuenta" : "Guardado en este dispositivo";
}
function render(){
  const vistas = {hoy:vistaHoy, uni:vistaUni, cal:vistaCal, hab:vistaHabitos, ejer:vistaEjer, prog:vistaProgreso};
  if (!vistas[ui.tab]) ui.tab = "hoy";
  document.getElementById("app").innerHTML = vistas[ui.tab]();
  document.getElementById("tabs").innerHTML = [["hoy","Hoy"],["uni","Uni"],["cal","Calendario"],["hab","Hábitos"],["ejer","Ejercicio"],["prog","Progreso"]]
    .map(([k,l])=>`<button data-a="tab" data-tab="${k}" class="${ui.tab===k?"on":""}" ${ui.tab===k?'aria-current="page"':""}>${ICON[k]}${l}</button>`).join("");
  pintarSync();
  if (ui.tab==="prog") dibujarRed(); else cancelAnimationFrame(netAnim);
}
addEventListener("resize", () => { if (ui.tab==="prog") dibujarRed(); });
render();
conectar();
</script>
